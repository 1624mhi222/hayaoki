<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="早起き">
<meta name="theme-color" content="#0c0a08">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Yuji+Syuku&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>早起き</title>
<style>
  /* 墨と朱。夜明け前の闇に、古い紙と金の縁 */
  :root {
    --bg: #0c0a08; --card: #15110d; --ink: #ebe0c8; --quiet: #9a8a70; --line: #3a2e20; --chip: #221b14;
    --accent: #c8392b; --accent-soft: #3a1611; --gold: #c9a24a; --good: #5f9e7a; --good-soft: #16271d;
    --warn: #d6964a; --warn-soft: #33230f; --bad: #e0584a; --bad-soft: #3a1512; --paper: #e8ddc3; --sumi: #17130f;
    --brush: "Yuji Syuku", "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: radial-gradient(120% 60% at 50% 0%, #2a1712 0%, #120d0a 45%, #0a0807 100%) fixed, #0a0807; }
  main { max-width: 520px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .label { font-size: 13px; color: var(--quiet); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  /* キャラクター */
  .pet { display: flex; gap: 14px; align-items: center; }
  .pet .face { font-size: 46px; line-height: 1; width: 64px; height: 64px; display: grid; place-items: center;
    background: var(--accent-soft); border-radius: 24px; flex: none; }
  .pet .face.hop { animation: hop .7s cubic-bezier(.3,1.6,.5,1) 2; }
  @keyframes hop { 40% { transform: translateY(-14px) rotate(-6deg); } }
  .pet .info { flex: 1; min-width: 0; }
  .pet .name { font-weight: 700; font-size: 17px; }
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s; }
  .stats { display: flex; gap: 8px; margin-top: 10px; }
  .stat { flex: 1; background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat { padding: 6px 10px; }
  /* 連続記録 */
  .streak { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 8px 12px; border-radius: 14px; background: var(--chip); }
  .streak.on { background: linear-gradient(90deg, var(--accent-soft), var(--warn-soft)); }
  .streak .flame { font-size: 34px; line-height: 1; filter: grayscale(1); opacity: .5; }
  .streak.on .flame { filter: none; opacity: 1; animation: flick 1.6s ease-in-out infinite; }
  @keyframes flick { 50% { transform: scale(1.08) rotate(-3deg); } }
  .streak b { font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
  .streak b + span { font-weight: 700; margin-left: 2px; }
  .streak > div:nth-child(2) { white-space: nowrap; }
  .streak .sub { margin-left: auto; text-align: right; font-size: 12px; color: var(--quiet); }
  .row2 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  /* 今日 */
  .today .when { font-size: 14px; color: var(--quiet); }
  .today .msg { font-size: 19px; font-weight: 700; margin: 4px 0 2px; }
  .today .hint { font-size: 14px; color: var(--quiet); }
  .big { display: block; width: 100%; border: 0; border-radius: 20px; padding: 20px 12px; margin-top: 10px;
    font: inherit; font-size: 26px; font-weight: 800; color: #fff; background: var(--accent); box-shadow: 0 6px 0 #b86f00; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b86f00; }
  .big.second { background: var(--good); box-shadow: 0 6px 0 #1f6a44; }
  .big.second:active { box-shadow: 0 2px 0 #1f6a44; }
  .count { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin: 6px 0; }
  .result { border-radius: 14px; padding: 10px 12px; margin-top: 8px; font-size: 15px; }
  .result.perfect { background: var(--good-soft); } .result.half { background: var(--warn-soft); }
  .result.over { background: var(--bad-soft); }
  .result .parts { margin-top: 8px; display: grid; gap: 2px; }
  .today .btn b { font-variant-numeric: tabular-nums; }
  .result b { font-size: 18px; }
  /* きろく */
  .weeks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weeks .wd { text-align: center; font-size: 11px; color: var(--quiet); }
  .weeks .c { height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 11px; color: var(--quiet); background: none; }
  .weeks .c.cls { background: var(--chip); }
  .weeks .c.perfect { background: var(--good); color: #fff; } .weeks .c.half { background: var(--warn); color: #fff; }
  .weeks .c.over { background: var(--bad); color: #fff; }
  .weeks .c.now { outline: 2px solid var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--quiet); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  /* 設定 */
  details summary { cursor: pointer; font-weight: 600; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; margin-top: 12px; }
  input[type=time], input[type=number] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
  .btn { border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; background: var(--chip); color: var(--ink); width: 100%; margin-top: 10px; }
  .btn.main { background: var(--accent); color: #fff; }
  .note { font-size: 13px; color: var(--quiet); margin: 8px 0 0; }
  .linkbtn { border: 0; background: none; color: var(--bad); font: inherit; font-size: 13px; padding: 0; margin-top: 12px; }
  .pop { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 800; color: var(--accent);
    pointer-events: none; animation: pop 1.6s ease-out forwards; text-shadow: 0 2px 0 var(--card); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pet .face.hop, .pop { animation: none; } }
  /* タブ */
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; z-index: 5;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .tabs button { flex: 1; max-width: 244px; border: 0; border-radius: 12px; padding: 10px; font: inherit; font-weight: 600; background: none; color: var(--quiet); }
  .tabs button.on { background: var(--accent-soft); color: var(--ink); }
  .pet .face.plant { background: var(--good-soft); }
  .bar.green > div { background: var(--good); }
  /* 日課・TODO */
  .item { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .what small { display: block; color: var(--quiet); font-size: 12px; }
  .item.off { opacity: .5; }
  .item.donef .what { text-decoration: line-through; color: var(--quiet); }
  .tick { flex: none; width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font-size: 18px; color: #fff; display: grid; place-items: center; }
  .tick.on { background: var(--good); border-color: var(--good); }
  .del { flex: none; border: 0; background: none; color: var(--quiet); font-size: 18px; width: 32px; height: 32px; }
  .fire { font-size: 12px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .due { font-size: 12px; border-radius: 6px; padding: 1px 6px; background: var(--chip); color: var(--quiet); margin-left: 4px; }
  .due.today { background: var(--warn-soft); color: var(--warn); } .due.over { background: var(--bad-soft); color: var(--bad); }
  .add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add input[type=text] { flex: 1 1 160px; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .add textarea { flex: 1 1 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); resize: vertical; }
  .add input[type=date] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .add .btn { width: auto; margin: 0; padding: 10px 16px; }
  .days { display: flex; gap: 4px; width: 100%; }
  .days button { flex: 1; border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 0; font: inherit; font-size: 13px; }
  .what[data-t=open] { cursor: pointer; }
  .add.editing { padding: 10px; margin: 6px 0; border-radius: 12px; background: var(--accent-soft); }
  .add.editing .btn { flex: 1; margin: 0; }
  .btn.danger { color: var(--bad); }
  .days.mode { margin-top: 4px; } .days .label { align-self: center; }
  .days input.every { width: 64px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); text-align: center; }
  .days button.on { background: var(--good-soft); border-color: var(--good); font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .head .linkbtn { color: var(--accent); margin: 0; }
  .empty { color: var(--quiet); font-size: 14px; padding: 6px 0; }
  .sugs { background: var(--accent-soft); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; }
  .sugs h2 { margin: 0; font-size: 14px; }
  .sugs .pull { all: unset; cursor: pointer; display: flex; width: 100%; justify-content: space-between; align-items: center; }
  .sugs .pull .tab { font-size: 12px; color: var(--quiet); margin-left: 6px; }
  .sugs.shut { padding-bottom: 8px; }
  .sugs .item { border-top-color: rgba(0,0,0,.06); }
  .btn.sm { width: auto; margin: 0; padding: 6px 12px; font-size: 13px; }
  /* PC: 早起き・日課・TODO・勉強を4列に並べ、タブは出さない */
  .cols { display: block; }
  @media (min-width: 1000px) {
    main { max-width: 1600px; padding-bottom: 24px; }
    .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .tabs { display: none; }
  }
  .status { text-align: center; font-size: 12px; color: var(--quiet); margin-top: 8px; }
  .grid input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
  .graves { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; font-size: 13px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .pet .face.wilt { background: var(--bad-soft); filter: saturate(.6); }
  .warnline { color: var(--bad); }
  .recap { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; overflow: auto; }
  .recap .card { width: 100%; max-width: 440px; margin: 0; box-shadow: 0 12px 40px rgba(0,0,0,.35); }

  /* ---- 厨二の装い ---- */
  body.lock { overflow: hidden; }
  .card { border-radius: 3px; background: linear-gradient(180deg, rgba(232,221,195,.045), rgba(0,0,0,0) 40%), var(--card);
    box-shadow: inset 0 0 0 1px rgba(201,162,74,.07), 0 10px 28px rgba(0,0,0,.55); position: relative; }
  h2 { font-family: var(--brush); font-weight: 400; font-size: 18px; letter-spacing: .04em; color: var(--gold); }
  .title { font-family: var(--brush); color: var(--gold); letter-spacing: .05em; font-size: 13px; }
  .pet { align-items: center; }
  .pet .name { font-family: var(--brush); font-weight: 400; font-size: 22px; line-height: 1.3; }
  .pet .face { font-family: var(--brush); font-size: 30px; border-radius: 50%; color: var(--paper);
    background: radial-gradient(circle at 40% 35%, #3a2a1c, #120d09); box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(201,162,74,.25); }
  .pet .face.plant { color: #cfe8d4; background: radial-gradient(circle at 40% 35%, #23402d, #0d1710); box-shadow: 0 0 0 1px var(--good), 0 0 18px rgba(95,158,122,.3); }
  .pet .face.wilt { color: #e0a9a2; background: radial-gradient(circle at 40% 35%, #40201b, #140a08); box-shadow: 0 0 0 1px var(--bad); }
  .bar { height: 6px; border-radius: 0; background: #2a2017; }
  .bar > div { border-radius: 0; background: linear-gradient(90deg, #7d1b12, var(--accent), #f0a05a); box-shadow: 0 0 10px rgba(200,57,43,.7); }
  .bar.green > div { background: linear-gradient(90deg, #1f4a33, var(--good), #b9e3c6); box-shadow: 0 0 10px rgba(95,158,122,.6); }
  .stat { background: var(--chip); border-radius: 2px; }
  .streak { border-radius: 2px; background: var(--chip); }
  .streak.on { background: linear-gradient(90deg, #4a160f, #22150d); box-shadow: inset 0 0 0 1px rgba(200,57,43,.4); }
  .streak .flame { font-family: var(--brush); font-size: 34px; color: var(--accent); filter: none; opacity: .35; }
  .streak.on .flame { opacity: 1; color: #ff7a4a; text-shadow: 0 0 14px #ff5a2a, 0 0 30px #c8392b; }
  .big { border-radius: 3px; font-family: var(--brush); font-weight: 400; font-size: 34px; letter-spacing: .3em; line-height: 1.2;
    background: linear-gradient(180deg, #c23426, #6e170f); box-shadow: 0 0 0 1px #f07a5a66, 0 0 30px rgba(200,57,43,.55), 0 5px 0 #3e0c07;
    text-shadow: 0 0 12px rgba(255,200,160,.6); animation: breathe 2.4s ease-in-out infinite; }
  .big small { display: block; font-family: "Shippori Mincho B1", serif; font-size: 13px; letter-spacing: .2em; opacity: .8; }
  .big:active { box-shadow: 0 0 0 1px #f07a5a66, 0 1px 0 #3e0c07; }
  .big.second { background: linear-gradient(180deg, #2c6b50, #102c20); box-shadow: 0 0 0 1px #7fd1a666, 0 0 30px rgba(95,158,122,.5), 0 5px 0 #071a11; font-size: 28px; }
  .big.second:active { box-shadow: 0 0 0 1px #7fd1a666, 0 1px 0 #071a11; }
  @keyframes breathe { 50% { box-shadow: 0 0 0 1px #f07a5a99, 0 0 46px rgba(255,90,50,.75), 0 5px 0 #3e0c07; } }
  .today .msg { font-family: var(--brush); font-weight: 400; font-size: 22px; }
  .result { border-radius: 2px; border-left: 3px solid var(--quiet); }
  .result.perfect { border-color: var(--good); } .result.half { border-color: var(--warn); } .result.over { border-color: var(--bad); }
  .result b { font-family: var(--brush); font-weight: 400; font-size: 19px; }
  .weeks .c { border-radius: 2px; }
  .weeks .c.perfect { background: #5a4417; color: #ffe7a8; box-shadow: inset 0 0 0 1px var(--gold); }
  .weeks .c.half { background: #4a2f12; color: #f3c58a; } .weeks .c.over { background: #a8281c; color: #fff; }
  .legend i { border-radius: 1px; }
  .btn, .add input[type=text], .add textarea, .add input[type=date], input[type=time], input[type=number], .grid input[type=text] { border-radius: 2px; }
  .btn.main { background: linear-gradient(180deg, #b52f22, #7a1a10); box-shadow: inset 0 0 0 1px #e0584a55; }
  .tick { border-radius: 2px; border-color: #4a3b29; }
  .tick.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(200,57,43,.6); }
  .days button { border-radius: 2px; }
  .days button.on { background: #5a2216; border-color: transparent; color: #ffd9b8; }
  .due { white-space: nowrap; }
  .sugs { border-radius: 2px; background: #20180f; box-shadow: inset 0 0 0 1px #4a3a22; }
  .sugs .item { border-top-color: #3a2e20; }
  .tabs { background: rgba(10,8,7,.94); border-top: 1px solid #4a3a22; backdrop-filter: blur(6px); }
  .tabs button { border-radius: 2px; padding: 10px 4px; white-space: nowrap; font-size: 13px; }
  .tabs button b { font-family: var(--brush); font-weight: 400; font-size: 20px; margin-right: 4px; vertical-align: -2px; }
  .tabs button.on { background: #2a120d; color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
  .tabs button.on b { color: #ff7a4a; text-shadow: 0 0 10px #c8392b; }
  .pop { color: #ffb08a; font-family: var(--brush); font-weight: 400; text-shadow: 0 0 16px #c8392b, 0 0 32px #c8392b; }
  .graves { border-top-color: #3a2e20; }
  /* 魔物の絵。古い紙に墨 */
  .art { --s: 112px; position: relative; width: var(--s); height: var(--s); flex: none; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 45%, #f1e8d2, #d9c9a4 75%, #b9a274); border-radius: 2px;
    box-shadow: inset 0 0 22px rgba(90,60,25,.5), 0 0 0 1px #6b5532, 0 6px 18px rgba(0,0,0,.6); }
  .art img { position: absolute; inset: 4%; width: 92%; height: 92%; object-fit: contain; mix-blend-mode: multiply; z-index: 1; }
  .art .glyph { font-family: var(--brush); color: #1a130c; font-size: calc(var(--s) * .38); line-height: 1; writing-mode: vertical-rl;
    letter-spacing: -.05em; opacity: .92; text-shadow: 0 0 1px #1a130c; }
  .art img + .glyph { opacity: 0; }
  .art .crop { position: absolute; z-index: 1; top: 4%; bottom: 4%; left: 50%; transform: translateX(-50%); overflow: hidden; max-width: 92%; }
  .art .crop img { position: absolute; inset: 0 auto auto 0; height: auto; max-width: none; mix-blend-mode: multiply; }
  .art .crop + .glyph, .art.st0 .crop + .glyph { opacity: 0; }
  .art .seal { position: absolute; right: 4px; bottom: 4px; z-index: 2; font-style: normal; font-family: var(--brush); font-size: calc(var(--s) * .12);
    line-height: 1; padding: 2px 3px; color: #f7e7d6; background: #a8281c; border-radius: 2px; box-shadow: 0 0 0 1px #f7e7d633 inset; }
  .art.r1 { box-shadow: inset 0 0 22px rgba(90,60,25,.5), 0 0 0 1px #5f9e7a, 0 6px 18px rgba(0,0,0,.6); }
  .art.r2 { box-shadow: inset 0 0 22px rgba(90,60,25,.5), 0 0 0 2px #5a7ec8, 0 0 16px rgba(90,126,200,.45); }
  .art.r3 { box-shadow: inset 0 0 22px rgba(90,60,25,.5), 0 0 0 2px #9b5ac8, 0 0 22px rgba(155,90,200,.55); }
  .art.r4 { box-shadow: inset 0 0 22px rgba(90,60,25,.5), 0 0 0 2px var(--gold), 0 0 28px rgba(232,190,90,.7); }
  .art .half { position: absolute; inset: 0; display: grid; place-items: center; }
  .art .half .glyph { display: none; }
  .art .half.l { -webkit-mask: linear-gradient(90deg, #000 45%, transparent 60%); mask: linear-gradient(90deg, #000 45%, transparent 60%); }
  .art .half.r { -webkit-mask: linear-gradient(90deg, transparent 40%, #000 55%); mask: linear-gradient(90deg, transparent 40%, #000 55%); filter: hue-rotate(160deg) saturate(1.4); }
  .art .glyph.hy { position: relative; z-index: 0; }
  .art .half:has(img) ~ .glyph.hy { opacity: .18; }
  /* 成長段階: 幼体は小さく色がない → 成体 → 真体は金の縁 → 神格は朱の気が立つ */
  .art.st0 > img, .art.st0 .glyph { filter: grayscale(1) contrast(.9); transform: scale(.72); opacity: .8; }
  .art.st0 .crop { filter: grayscale(1) contrast(.9); scale: .72; opacity: .8; }
  .art.st2 { outline: 1px solid var(--gold); outline-offset: 3px; }
  .art.st3 { outline: 2px solid var(--gold); outline-offset: 3px; overflow: visible; }
  .art.st3::after { content: ''; position: absolute; inset: -10px; z-index: -1; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,50,.65), transparent 70%); animation: aura 2.2s ease-in-out infinite; }
  @keyframes aura { 50% { transform: scale(1.15); opacity: .6; } }
  .art.egg { border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; width: 92px; height: 112px; background: radial-gradient(circle at 40% 35%, #3a2c1e, #0e0a07);
    box-shadow: 0 0 0 1px var(--gold), 0 0 26px rgba(201,162,74,.35); animation: aura 3s ease-in-out infinite; }
  .art.egg .glyph { color: var(--gold); writing-mode: horizontal-tb; font-size: 40px; }

<body>
<main id="app"></main>
<script src="bestiary.js"></script>
<script src="art.js"></script>
<script>
// ---- 計算(画面と切り離した純粋な関数) ----
const MIN = 60000;
const WIN = 20;   // 2回目のチェックインを押せる長さ(分)
const XP = { perfect: 20, half: 5, over: 0 };
const BONUS = 7, BONUS_XP = 30;   // 7日続くごとにボーナス
const RESULT = {
  perfect: '完全覚醒 ― 二度寝の誘惑を断ち切った',
  half: '半覚醒 ― 二度寝の確認ができなかった',
  over: '寝坊 ― 闇に呑まれた',
};
// 相棒の成長段階。lv はその段階になるレベル。名は五行ごとの二つ名で飾る
const STAGES = [
  { lv: 1, name: '幼体' }, { lv: 5, name: '成体' }, { lv: 10, name: '真体' }, { lv: 20, name: '神格' },
];
const EPITHET = { 木: '翠嵐', 火: '劫火', 土: '黄塵', 金: '白刃', 水: '深淵' };
const stageName = (b, k) => [`${b.k}ノ仔`, b.k, `${EPITHET[b.e]}ノ${b.k}`, `神格・${EPITHET[b.e]}ノ${b.k}`][k];
// 重なった数で★が上がる(合体)
const stars = n => n >= 12 ? 5 : n >= 7 ? 4 : n >= 4 ? 3 : n >= 2 ? 2 : 1;
const PLANTS = [
  { lv: 1, face: '種', name: '眠れる種子' }, { lv: 2, face: '芽', name: '目覚めの芽' }, { lv: 3, face: '葉', name: '若葉' },
  { lv: 5, face: '苗', name: '霊苗' }, { lv: 7, face: '蕾', name: '紅き蕾' }, { lv: 10, face: '華', name: '血華' },
  { lv: 14, face: '樹', name: '古樹' }, { lv: 19, face: '桜', name: '妖桜' }, { lv: 25, face: '神木', name: '世界樹' },
];
// 日付などの文字列から決まる乱数。同じ記録からは何度計算しても同じ魔物が出る
const rng = str => { let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; };
// Obsidian から来た「提案」。アプリで「追加」を押すまでは TODO に数えない
const isSug = x => !!(x.src && x.src.startsWith('提案:') && !x.accepted);
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const Calc = {
  pad: n => String(n).padStart(2, '0'),
  ymd(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); },
  hm(d) { return this.pad(d.getHours()) + ':' + this.pad(d.getMinutes()); },
  parse(ymd) { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); },
  addDays(ymd, k) { const d = this.parse(ymd); d.setDate(d.getDate() + k); return this.ymd(d); },
  // その日の目標起床と、「起きた！」を押せるようになる時刻。目標がない日は null
  plan(ymd, s) {
    const t = s.wake[this.parse(ymd).getDay()];
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    const target = this.parse(ymd); target.setHours(h, m, 0, 0);
    return { target, open: new Date(target - 90 * MIN), close: new Date(+target + MIN) };
  },
  // 今どの段階か(phase)と、決まっていれば結果(result)
  // 流れ: 目標の時間までに「起きた！」(c1) → 15分後に「まだ起きてる！」(c2)
  judge(p, rec, now, s) {
    if (!p) return { phase: 'off' };
    rec = rec || {};
    const c1 = rec.c1 ? new Date(rec.c1) : null, c2 = rec.c2 ? new Date(rec.c2) : null;
    if (!c1 || c1 >= p.close) {
      if (now < p.open) return { phase: 'early' };
      if (now < p.close) return { phase: 'wake' };
      return { phase: 'done', result: 'over', xp: 0 };
    }
    const from = new Date(+c1 + s.gap * MIN), until = new Date(+from + WIN * MIN);
    if (c2) return { phase: 'done', result: 'perfect', xp: XP.perfect, c1, c2 };
    if (now < from) return { phase: 'wait', from, c1 };
    if (now < until) return { phase: 'second', until, c1 };
    return { phase: 'done', result: 'half', xp: XP.half, c1 };
  },
  // 使い始めた日から今日までを順に見て、経験値と連続記録を数える
  // 大成功で連続+1(7日ごとにボーナス)、二度寝で連続は0。寝坊したらひよこは死んで、お墓に入り、たまごからやり直し
  // 霊獣は1体。早起き・日課・TODO・勉強の経験値がぜんぶこの1体に入る
  // 早起き 大成功+20 二度寝+5 寝坊は相棒の★が1つ減って経験値0 / 日課+5 サボり-5 / TODO+8 期限切れ1日-3 / 勉強5分で+1
  // 勉強は週の目標に届いたら特別召喚と+30、届かなかったら-40
  stats(log, s, now, x = {}) {
    const today = this.ymd(now);
    let xp = 0, streak = 0, best = 0, perfect = 0, days = 0, bonus = 0;
    const habits = x.habits || [], hlog = x.hlog || {}, todos = (x.todos || []).filter(t => !isSug(t)), study = x.study || [];
    const doneDay = t => t.done ? this.ymd(new Date(t.done)) : null;
    const sMin = {}, sWeek = {};
    study.forEach(e => { const d = this.ymd(new Date(e.at)); sMin[d] = (sMin[d] || 0) + e.min; const w = this.week(new Date(e.at)); sWeek[w] = (sWeek[w] || 0) + e.min; });
    const ss = s.study || {}, weeks = [];
    const day = { task: 0, study: 0, pen: 0 };   // 今日のぶん(画面に出す)
    const graves = [];
    // 魔物: 大成功の朝に1体召喚。7日連続のボーナスでは珍獣以上をもう1体。同じ魔物は重なって★が上がる
    // 寝坊すると相棒が逃げる(★が1つ減り、0になったらいなくなる)
    const own = {}, seen = {}, events = [], hybrids = {}, seed = s.seed || s.start;
    let partner = null;
    const get = (id, kind) => {
      id = String(id); own[id] = (own[id] || 0) + 1; if (!seen[id]) seen[id] = events.length + 1;
      events.push({ id, kind, n: own[id] }); if (!partner) partner = id;
    };
    // 勉強で神獣まで育てて卒業させた霊獣も、その日に仲間に加わる
    const grads = ((s.study || {}).pets || []).filter(p => p.end && p.end.k === 'grad')
      .map(p => ({ t: new Date(p.end.t).toISOString(), id: p.sp, n: p.n || 1, hyb: p.hyb, imp: p.imp, a0: 'grad' }));
    const acts = [...(s.picks || []).map(x => ({ ...x, a0: 'pick' })), ...(s.breeds || []).map(x => ({ ...x, a0: 'breed' })), ...grads].sort((a, b) => a.t < b.t ? -1 : 1);
    for (let d = s.start; d <= today; d = this.addDays(d, 1)) {
      // 日課・TODO・勉強
      let task = 0, pen = 0;
      habits.forEach(h => {
        if (!this.isDue(h, d) || (h.since && h.since > d)) return;
        if ((hlog[d] || []).includes(h.id)) task += 5; else if (d < today) pen += 5;
      });
      todos.forEach(t => {
        if (doneDay(t) === d) task += 8;
        if (t.due && t.due < d && (!t.done || doneDay(t) >= d)) pen += 3;
      });
      const smin = sMin[d] || 0, sxp = Math.floor(smin / 5);
      xp = Math.max(0, xp + task + sxp - pen);
      if (d === today) Object.assign(day, { task, study: sxp, pen });
      // 日曜で週がしめくくられたら、勉強の目標を見る
      if (this.parse(d).getDay() === 0 && d < today) {
        const w = this.week(this.parse(d)), g = this.goalFor(ss, w), m = sWeek[w] || 0;
        if (w >= s.start && g > 0) {   // 途中から始めた週は数えない
          weeks.push({ w, m, g, ok: m >= g });
          if (m >= g) { xp += 30; get(this.egg(seed + '|w' + w), 'study'); } else xp = Math.max(0, xp - 40);
        }
      }
      const j = this.judge(this.plan(d, s), log[d], now, s);
      if (j.result) {
        days++; xp += j.xp;
        if (j.result === 'perfect') {
          streak++; perfect++;
          get(this.summon(seed + '|' + d, events.length ? 0 : 1), 'summon');
          if (streak % BONUS === 0) { xp += BONUS_XP; bonus++; get(this.summon(seed + '|' + d + '|b', 2), 'bonus'); }
        } else streak = 0;
        best = Math.max(best, streak);
        if (j.result === 'over') {
          const L = this.level(xp);
          graves.push({ day: d, lv: L.lv, id: partner, k: STAGES.indexOf(L.stage), fled: partner && own[partner] === 1 });
          if (partner) {
            own[partner]--;
            if (!own[partner]) { delete own[partner]; partner = [...events].reverse().map(e => e.id).find(id => own[id]) || null; }
          }
          xp = 0;
        }
      }
      // その日に選んだ相棒・交配をあてはめる
      acts.filter(x => x.t.slice(0, 10) === d || (d === s.start && x.t.slice(0, 10) < d)).forEach(x => {
        if (x.a0 === 'pick' && own[x.id]) partner = x.id;
        if (x.a0 === 'grad') { if (x.hyb) hybrids[x.id] = x.hyb; for (let k = 0; k < x.n; k++) get(x.id, x.imp ? 'move' : 'study'); }
        if (x.a0 === 'breed' && x.a !== x.b && own[x.a] >= 2 && own[x.b] >= 2 && !hybrids[x.id]) {
          own[x.a]--; own[x.b]--; hybrids[x.id] = { a: x.a, b: x.b }; get(x.id, 'breed');
        }
      });
    }
    const mon = { own, seen, events, partner, hybrids };
    return { xp, streak, best, perfect, days, bonus, graves, mon, day, weeks, gen: graves.length + 1, toBonus: BONUS - streak % BONUS, ...this.level(xp) };
  },
  // 珍しさを重みで決めてから、その珍しさの魔物を1体。minR より下は出ない
  summon(seed, minR = 0) {
    const r = rng(seed), ws = RARITY.map((x, i) => i < minR ? 0 : x.w);
    let x = r() * ws.reduce((a, b) => a + b), k = 0;
    while (x >= ws[k]) x -= ws[k++];
    const pool = BEASTS.filter(b => b.r === k && b.id <= MORNING);
    return pool[Math.floor(r() * pool.length)].id;
  },
  // 勉強の卵から生まれる霊獣。164種ぜんぶから。半分は勉強でしか会えない霊獣のなかから
  egg(seed) {
    const r = rng(seed), ws = RARITY.map(x => x.w);
    let x = r() * ws.reduce((a, b) => a + b), k = 0;
    while (x >= ws[k]) x -= ws[k++];
    const all = BEASTS.filter(b => b.r === k), only = all.filter(b => b.study);
    const pool = only.length && r() < .5 ? only : all;
    return String(pool[Math.floor(r() * pool.length)].id);
  },
  // ---- 勉強 ----
  // 週は月曜はじまり。その週の月曜の日付で呼ぶ
  week(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return this.ymd(x); },
  // その週の目標(分)。目標を変えた週から先はその値
  goalFor(ss, w) {
    const ks = Object.keys(ss.goals || {}).sort();
    if (!ks.length) return 600;
    const k = ks.filter(x => x <= w).pop() || ks[0];
    return ss.goals[k];
  },
  // 霊獣のようす。週の目標ぶん勉強するたびに次の姿(卵→幼獣→若獣→成獣→神獣)。記録を消すとその分もどる
  // 日曜24時にその週の勉強が目標に届いていなければ、天に還る
  study(list, ss, now) {
    const cur = this.week(now), goal = this.goalFor(ss, cur);
    const byWeek = {};
    list.forEach(e => { const w = this.week(new Date(e.at)); byWeek[w] = (byWeek[w] || 0) + e.min; });
    const total = byWeek[cur] || 0;
    const hist = [];
    for (let w = ss.from; w && w < cur; w = this.addDays(w, 7)) { const g = this.goalFor(ss, w), m = byWeek[w] || 0; hist.unshift({ w, m, g, ok: m >= g }); }
    const pets = (ss.pets || []).filter(p => !p.imp), p = pets[pets.length - 1];
    let died = null;
    if (p) for (let w = [this.week(new Date(p.t)), ss.from].sort().pop(); w < cur; w = this.addDays(w, 7)) {
      if ((byWeek[w] || 0) < this.goalFor(ss, w)) { died = w; break; }
    }
    const xp = p ? list.filter(e => e.at >= p.t).reduce((a, e) => a + e.min, 0) : 0;
    const stage = Math.min(4, Math.floor(xp / goal));
    const frac = stage >= 4 ? 1 : (xp - stage * goal) / goal, toNext = stage >= 4 ? 0 : (stage + 1) * goal - xp;
    // 今週の進みぐあい。経った時間より勉強が遅れているほど弱っていく
    const elapsed = Math.min(1, Math.max(0, (now - this.parse(cur)) / (7 * 864e5)));
    const pr = goal > 0 ? total / goal : 1, lag = elapsed - pr;
    const mood = pr >= 1 ? 'happy' : lag <= 0 ? 'genki' : lag < .15 ? 'normal' : lag < .35 ? 'weak' : 'dying';
    const daysLeft = 7 - (now.getDay() + 6) % 7, remain = Math.max(0, goal - total);

  },
  // レベル1→2は40、そこから1レベルごとに必要な経験値が20ずつ増える
  level(xp, stages = STAGES) {
    let lv = 1, need = 40, rest = xp;
    while (rest >= need) { rest -= need; lv++; need += 20; }

  // 日課とTODOで育てる植物。ひよことは別の経験値。日課1回+5、TODO1つ+8

  garden(st, today) {

    const checks = Object.values(st.hlog).reduce((a, l) => a + l.length, 0);
    const done = st.todos.filter(x => x.done).length;

    st.todos.forEach(x => {
      if (!x.due) return;

      late += Math.max(0, Math.round((this.parse(end) - this.parse(x.due)) / 864e5));
    });

    const xp = Math.max(0, checks * 5 + done * 8 - penalty);
    const L = this.level(xp, PLANTS);

  },
  // 日課をやる日か。曜日で決めるもの(days)と、始めた日からN日ごとのもの(every)がある
  isDue(h, d) {
    if (h.every) { const k = Math.round((this.parse(d) - this.parse(h.since)) / 864e5); return k >= 0 && k % h.every === 0; }

  nextDue(h, d) { for (let k = 1; k <= 60; k++) { const x = this.addDays(d, k); if (this.isDue(h, x)) return x; } return null; },
  // その日課が何回続けてできているか。今日まだなら昨日までを数える
  habitStreak(h, hlog, today) {

      const by = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][t.getDay()];

        'DTSTART:' + f(t), 'DTEND:' + f(new Date(+t + (s.gap + 5) * MIN)), 'RRULE:FREQ=WEEKLY;BYDAY=' + by,
        'SUMMARY:☀️ 早起きアプリで「起きた！」を押す',

        'END:VEVENT');
    }

// 記録は種類ごとに { id: 中身 } にして送る。同じものは更新時刻(u)が新しいほうが勝つ
const KINDS = ['settings', 'log', 'hlog', 'habits', 'todos', 'study'];
const bare = v => { const c = Object.assign({}, v); delete c.u; return JSON.stringify(c); };
const Sync = {
  conf: store.get('ha-api', null),       // { url, key }
  seen: store.get('ha-seen', null),      // 前回の中身 { kind: { id: JSON } }
  status: '', busy: false, again: false, timer: null,
  doc() {
    const byId = l => Object.fromEntries(l.map(x => [x.id, x]));
    return {
      settings: { main: S.settings }, log: Object.assign({}, S.log),
      hlog: Object.fromEntries(Object.keys(S.hlog).map(d => [d, { ids: S.hlog[d], u: S.hlogU[d] || 0 }])),
      habits: byId(S.habits), todos: byId(S.todos), study: byId(S.study), dead: Object.assign({}, S.dead),
    };
  },
  snapshot(doc) { const o = {}; KINDS.forEach(k => { o[k] = {}; Object.keys(doc[k]).forEach(id => o[k][id] = bare(doc[k][id])); }); return o; },
  stamp() {
    const doc = this.doc(), t = Date.now();
    if (!this.seen) { this.seen = this.snapshot(doc); store.set('ha-seen', this.seen); return; }
    KINDS.forEach(k => {
      const before = this.seen[k] || {};
      Object.keys(doc[k]).forEach(id => {
        if (before[id] === bare(doc[k][id])) return;
        if (k === 'hlog') S.hlogU[id] = t; else if (k === 'settings') S.settings.u = t; else doc[k][id].u = t;
      });
      Object.keys(before).forEach(id => {
        if (id in doc[k]) return;
        if (k === 'habits' || k === 'todos' || k === 'study') S.dead[id] = { u: t };
        else if (k === 'log') S.log[id] = { u: t };
        else if (k === 'hlog') { S.hlog[id] = []; S.hlogU[id] = t; }

    });
    this.seen = this.snapshot(this.doc()); store.set('ha-seen', this.seen);
  },
  merge(a, b) {
    const o = {};
    [...KINDS, 'dead'].forEach(k => {
      o[k] = Object.assign({}, a[k]);
      Object.keys(b[k] || {}).forEach(id => { if (!o[k][id] || (b[k][id].u || 0) > (o[k][id].u || 0)) o[k][id] = b[k][id]; });
    });
    return o;
  },
  apply(doc) {
    if (doc.settings.main) S.settings = migrate(doc.settings.main);
    S.log = doc.log;
    S.hlog = Object.fromEntries(Object.keys(doc.hlog).map(d => [d, doc.hlog[d].ids || []]));
    S.hlogU = Object.fromEntries(Object.keys(doc.hlog).map(d => [d, doc.hlog[d].u || 0]));
    S.dead = doc.dead;
    S.habits = Object.values(doc.habits).filter(x => !S.dead[x.id]);
    S.todos = Object.values(doc.todos).filter(x => !S.dead[x.id]);

  soon(ms = 1500) { if (!this.conf) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async run() {
    if (!this.conf) return;

    this.busy = true; this.again = false;
    try {
      const got = await callApi(this.conf, 'sync', [this.doc()]);
      this.stamp();                                   // 送っているあいだに変わったものも残す
      const mine = JSON.stringify(this.doc());
      const merged = this.merge(got, this.doc());     // 同じ時刻ならシートのほうを使う
      this.apply(merged);

      if (JSON.stringify(this.doc()) !== mine && !(document.activeElement && document.activeElement.matches('input, textarea'))) render();
    } catch (e) {

async function callApi(conf, name, args) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  try {
    // text/plain にすると事前確認(CORS preflight)なしで Apps Script に届く
    const res = await fetch(conf.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: conf.key, fn: name, args }), redirect: 'follow', signal: ctl.signal });
    const text = await res.text();
    let out;
    try { out = JSON.parse(text); } catch (e) { const err = new Error('URLが違うか、デプロイのアクセスが「全員」になっていません'); err.server = true; throw err; }
    if (!out.ok) { const err = new Error(out.error); err.server = true; throw err; }
    return out.result;
  } finally { clearTimeout(timer); }
}

function todayCard(t) {
  const d = Calc.ymd(t), p = Calc.plan(d, S.settings), j = Calc.judge(p, S.log[d], t, S.settings);
  let head = `<div class="when">${t.getMonth() + 1}月${t.getDate()}日(${WD[t.getDay()]})`;
  if (p) head += ` ・ 目標起床 <b>${Calc.hm(p.target)}</b>`;
  head += '</div>';
  let body = '';
  if (j.phase === 'off') {
    const nx = nextWake(d);
    body = `<div class="msg">今日は目標なし 🌙</div><div class="hint">${nx ? `次は ${nx}。前の日は早めに寝よう` : '設定で起きる時間を入れてね'}</div>`;
  } else if (j.phase === 'early') {
    body = `<div class="msg">まだ夜の刻</div><div class="hint">${Calc.hm(p.open)} から押せるようになる。寝坊すれば相棒は逃げ去る</div>`;
  } else if (j.phase === 'wake') {
    body = `<div class="hint">あと <b data-until="${+p.close}">${mmss(p.close - t)}</b> 以内に押せ。間に合わなければ相棒は逃げ去る</div>
      <button class="big" data-act="c1">覚 醒<small>起きた！</small></button>`;
  } else if (j.phase === 'wait') {
    body = `<div class="row2"><div class="msg">二度寝チェックまで</div><div class="count" data-until="${+j.from}">${mmss(j.from - t)}</div></div>
      <div class="hint">布団から出て、顔を洗ったり着替えたりしておこう。${Calc.hm(j.from)} から ${WIN}分のあいだに「まだ起きてる！」を押してね。スマホのタイマーを${S.settings.gap}分にしておくと確実です。</div>`;
  } else if (j.phase === 'second') {
    body = `<div class="hint">あと <b data-until="${+j.until}">${mmss(j.until - t)}</b> 以内に押してね。押せないと連続記録が0に戻ります</div>
      <button class="big second" data-act="c2">二度寝ヲ断ツ<small>まだ起きてる！</small></button>`;
  } else {
    const r = j.result;
    const times = [j.c1 && `起きた ${Calc.hm(j.c1)}`, j.c2 && `2回目 ${Calc.hm(j.c2)}`].filter(Boolean).join(' ・ ');
    body = `<div class="result ${r}"><b>${RESULT[r]}</b> <span>+${j.xp} XP</span>${times ? `<div class="label">${times}</div>` : ''}
      ${r === 'over' ? '<div class="note">寝坊の朝、相棒は★を一つ失い、力も失った。★がなくなった魔物は去っていく</div>' : ''}
      ${r === 'half' ? '<div class="note">連続記録は0に戻りました</div>' : ''}</div>`;
  }
  return `<section class="card today">${head}${body}</section>`;
}

function nextWake(d) {
  for (let k = 1; k <= 7; k++) {
    const x = Calc.addDays(d, k), p = Calc.plan(x, S.settings);
    if (p) return `${WD[p.target.getDay()]}曜 ${Calc.hm(p.target)}起床`;
  }
  return null;
}

// 直近4週間。月曜はじまり
function weeksCard(t) {
  const today = Calc.ymd(t);
  const back = (t.getDay() + 6) % 7;
  const first = Calc.addDays(today, -back - 21);
  let cells = ['月', '火', '水', '木', '金', '土', '日'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let k = 0; k < 28; k++) {
    const d = Calc.addDays(first, k), p = Calc.plan(d, S.settings);
    let cls = 'c';
    if (p && d >= S.settings.start && d <= today) {
      const j = Calc.judge(p, S.log[d], t, S.settings);
      cls += ' cls' + (j.result ? ' ' + j.result : '');
    } else if (p && d > today) cls += ' cls';
    if (d === today) cls += ' now';
    cells += `<div class="${cls}">${Number(d.slice(8))}</div>`;
  }
  return `<section class="card"><h2>戦歴</h2><div class="weeks">${cells}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>完全覚醒</span><span><i style="background:#4a2f12"></i>半覚醒</span>
    <span><i style="background:#a8281c"></i>寝坊</span><span><i style="background:var(--chip)"></i>目標がある日</span></div></section>`;
}

function todosCard(t) {
  const today = Calc.ymd(t);
  const sugs = S.todos.filter(x => isSug(x) && !x.done);
  const open = S.todos.filter(x => !x.done && !isSug(x)).sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0);
  const done = S.todos.filter(x => x.done && !isSug(x)).sort((a, b) => a.done < b.done ? 1 : -1);
  const dueTag = x => {
    if (!x.due) return '';
    const cls = x.due < today ? 'over' : x.due === today ? 'today' : '';
    const txt = x.due === today ? '今日まで' : x.due === Calc.addDays(today, 1) ? '明日まで' : `${Number(x.due.slice(5, 7))}/${Number(x.due.slice(8))}${x.due < today ? ' 過ぎてる' : 'まで'}`;
    return `<span class="due ${cls}">${txt}</span>`;
  };
  const row = x => S.editing === x.id ? `<form class="add editing" data-form="etodo" data-id="${x.id}">
      <input type="text" name="text" value="${esc(x.text)}" maxlength="80" autocomplete="off"><input type="date" name="due" value="${x.due || ''}" aria-label="期限">
      <div class="days"><button class="btn main">保存</button><button type="button" class="btn" data-t="cancel">やめる</button></div></form>` : `<div class="item ${x.done ? 'donef' : ''}">
    <button class="tick ${x.done ? 'on' : ''}" data-t="tcheck" data-id="${x.id}" aria-label="できた">${x.done ? '✓' : ''}</button>
    <div class="what" data-t="open" data-id="${x.id}">${esc(x.text)}${x.done ? '' : dueTag(x)}</div>
    <button class="del" data-t="tdel" data-id="${x.id}" aria-label="消す">✕</button></div>`;
  const note = x => x.src.slice(3).split('::')[0].split('/').pop().replace(/\.md$/, '');

    ${!S.sugOpen ? '' : sugs.map(x => `<div class="item"><div class="what">${esc(x.text)}${dueTag(x)}<small>${esc(note(x))}</small></div>

  return `<section class="card"><h2>TODO</h2>${sugCard}${open.map(row).join('') || '<div class="empty">やることはぜんぶ終わり 🎉</div>'}
    <form class="add" data-form="todo">${S.bulk

  </section>`;
}

function studyChart(z, t) {
  const ss = S.settings.study, cur = z.cur;
  const list = S.study.filter(e => Calc.week(new Date(e.at)) === cur);
  const days = [0, 1, 2, 3, 4, 5, 6].map(() => ({})), by = {};
  list.forEach(e => { const k = (new Date(e.at).getDay() + 6) % 7; days[k][e.s] = (days[k][e.s] || 0) + e.min; by[e.s] = (by[e.s] || 0) + e.min; });
  const tot = days.map(o => Object.values(o).reduce((a, b) => a + b, 0)), target = z.goal / 7;
  const ymax = Math.max(60, target * 1.25, ...tot.map(v => v * 1.15));
  const W = 700, top = 26, bot = 196, left = 12, colW = (W - left * 2) / 7, bw = Math.min(54, colW * .55), y = v => bot - v / ymax * (bot - top);
  const ti = (t.getDay() + 6) % 7;
  const ids = [...ss.subjects.map(x => x.id), ...Object.keys(by).filter(k => !ss.subjects.some(x => x.id === k))];
  let svg = `<svg viewBox="0 0 ${W} 230" role="img" aria-label="曜日ごとの勉強時間"><line x1="${left}" x2="${W - left}" y1="${bot}" y2="${bot}" stroke="#3a2e20" stroke-width="1.5"/>`;
  days.forEach((o, i) => {
    const cx = left + colW * i + colW / 2; let acc = 0;
    ids.forEach(id => { const v = o[id]; if (!v) return; const y0 = y(acc), y1 = y(acc + v); acc += v;
      svg += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(1, y0 - y1)}" fill="${subjOf(id).color}"><title>${esc(subjOf(id).name)} ${fmtMin(v)}</title></rect>`; });
    if (tot[i]) svg += `<text x="${cx}" y="${y(tot[i]) - 7}" text-anchor="middle" font-size="15" fill="#ebe0c8">${fmtMin(tot[i])}</text>`;
    svg += `<text x="${cx}" y="${bot + 24}" text-anchor="middle" font-size="16" fill="${i === ti ? '#ff7a4a' : '#9a8a70'}">${'月火水木金土日'[i]}</text>`;
  });
  svg += `<line x1="${left}" x2="${W - left}" y1="${y(target)}" y2="${y(target)}" stroke="#9a8a70" stroke-dasharray="5 5" stroke-width="1.5"/>
    <text x="${W - left}" y="${y(target) - 6}" text-anchor="end" font-size="13" fill="#9a8a70">1日の目安 ${fmtMin(target)}</text></svg>`;
  const sum = list.reduce((a, e) => a + e.min, 0);
  const rows = Object.keys(by).sort((a, b) => by[b] - by[a]).map(id => { const x = subjOf(id), v = by[id];
    return `<div class="subj"><span class="chip"><i style="background:${x.color}"></i>${esc(x.name)}</span><span class="sb"><i style="width:${v / sum * 100}%;background:${x.color}"></i></span><span>${fmtMin(v)}</span></div>`; }).join('');
  return `<section class="card"><div class="head"><h2>今週の勉強</h2><span class="label">${md(cur)}〜${md(Calc.addDays(cur, 6))} ・ 合計 ${fmtMin(sum)}</span></div>
    <div class="chart">${svg}</div>${rows || '<div class="empty">今週の記録はまだない。タイマーをスタートするか、手で追加すると、曜日別・教科別の時間が出ます</div>'}</section>`;
}

function render() {

  const keep = [...document.querySelectorAll('form[data-form] input:not([type=file]), form[data-form] textarea, form[data-form] select')].map(i => [i.form.dataset.form, i.name, i.value]);
  const focused = document.activeElement && document.activeElement.form && document.activeElement.name ? [document.activeElement.form.dataset.form, document.activeElement.name] : null;
  const st = Calc.stats(S.log, S.settings, t, S);
  const wake = () => petCard(st) + todayCard(t) + weeksCard(t) + settingsCard();
  const habits = () => gardenCard(st, t) + habitsCard(t);
  const study = () => { const z = Calc.study(S.study, S.settings.study, t); return studyGoalCard(z, st) + timerCard(t) + studyChart(z, t) + entriesCard(z) + studySettings(z); };
  if (WIDE.matches) $('#app').innerHTML = `<div class="cols"><div>${wake()}</div><div>${habits()}</div><div>${todosCard(t)}</div><div>${study()}</div></div>` + tabsBar();
  else $('#app').innerHTML = (S.tab === 'tasks' ? habits() + todosCard(t) : S.tab === 'study' ? study() : wake()) + tabsBar();
  const rc = recapItems(t);
  const ovs = (S.dex ? dexView(st) : '') + revealView(st) + (rc ? recapView(rc) : '');
  if (ovs) $('#app').insertAdjacentHTML('beforeend', ovs);

  if (focused) { const i = $(`[data-form=${focused[0]}] [name=${focused[1]}]`); if (i) i.focus(); }

// 開いたままにしているとき、2回目の時間になったら音と通知で知らせる
let alarm = null;
function armSecond(ms) {
  clearTimeout(alarm);
  alarm = setTimeout(() => {
    try { if (Notification.permission === 'granted') new Notification('まだ起きてる？', { body: '「まだ起きてる！」を押してね', icon: 'icon-192.png' }); } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
    beep();
    render();
  }, ms);
}
let ctx = null;
function beep() {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(at => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.2, ctx.currentTime + at); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + at + .3);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + .3);
    });
  } catch (e) {}
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const t = now(), d = Calc.ymd(t), act = b.dataset.act;
  if (act === 'c1' || act === 'c2') {
    const before = Calc.stats(S.log, S.settings, t, S);
    S.log[d] = Object.assign({}, S.log[d], { [act]: t.toISOString() });
    saveLog();
    if (act === 'c1') {
      try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}   // 押したときに音を使えるようにしておく
      armSecond(S.settings.gap * MIN);
    }
    render();
    const after = Calc.stats(S.log, S.settings, t, S);
    if (act === 'c2') pop(after.lv > before.lv ? `覚醒 Lv.${after.lv}` : `+${after.xp - before.xp} XP`);
    else pop('目覚めよ');
  } else if (act === 'ics') {
    const blob = new Blob([Calc.ics(S.settings, t)], { type: 'text/calendar' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hayaoki.ics'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } else if (act === 'notify') {
    try { Notification.requestPermission().then(p => alert(p === 'granted' ? '許可しました' : '許可されませんでした')); }
    catch (err) { alert('この端末では通知を使えません'); }
  } else if (act === 'api') {

    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url) || !key) { alert('Apps ScriptのURL（https://script.google.com/…/exec）と合言葉を入れてね'); return; }

    // タスク・日課・勉強の記録は残し、相棒・図鑑・連続記録・経験値だけを明日から数え直す
    if (confirm('連続記録・経験値・相棒・図鑑をリセットして、明日から始めます。TODO・日課・勉強の記録は消えません。よいですか？')) {
      store.set('ha-shown', 0); S.settings.picks = []; S.settings.breeds = []; S.settings.start = Calc.addDays(d, 1); S.settings.seed = uid();

    case 'rtodo': { const x = S.todos.find(x => x.id === id); if (x) x.done = new Date(Calc.parse(b.dataset.y).setHours(23)).toISOString(); break; }   // 昨日のうちに終わったことにする
    case 'rclose': store.set('ha-recap', d); render(); return;
    case 'saccept': { const x = S.todos.find(x => x.id === id); if (x) x.accepted = true; break; }
    default: return;
  }
  saveTasks(); render();
  const after = Calc.stats(S.log, S.settings, t, S);
  if (after.xp > before.xp) pop(after.lv > before.lv ? `覚醒 Lv.${after.lv}` : `+${after.xp - before.xp} XP`, '#face2');
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'habit') {
    const name = f.elements['name'].value.trim(); if (!name) return;
    if (S.newEvery) {
      const every = Math.round(Number(f.elements['every'].value));
      if (!(every >= 2 && every <= 60)) { alert('2〜60日のあいだで入れてね'); return; }
      S.habits.push({ id: uid(), name, every, days: [], since: Calc.ymd(now()) });
    } else {
      if (!S.newDays.length) { alert('やる曜日を1つ以上えらんでね'); return; }
      S.habits.push({ id: uid(), name, days: [...S.newDays].sort(), since: Calc.ymd(now()) });
    }
    S.newDays = [0, 1, 2, 3, 4, 5, 6]; S.newEvery = false;
  } else if (f.dataset.form === 'ehabit') {
    const h = S.habits.find(x => x.id === f.dataset.id); if (!h) return;
    const name = f.elements['name'].value.trim(); if (!name) return;
    if (S.ed.every) {
      const every = Math.round(Number(f.elements['every'].value));
      if (!(every >= 2 && every <= 60)) { alert('2〜60日のあいだで入れてね'); return; }
      // N日ごとに変えたときは、今日を始まりにする
      if (!h.every) h.since = Calc.ymd(now());
      h.every = every; h.days = [];
    } else {
      if (!S.ed.days.length) { alert('やる曜日を1つ以上えらんでね'); return; }
      delete h.every; h.days = [...S.ed.days].sort();
    }
    h.name = name; S.editing = null;
  } else if (f.dataset.form === 'etodo') {
    const x = S.todos.find(x => x.id === f.dataset.id); if (!x) return;
    const text = f.elements['text'].value.trim(); if (!text) return;
    x.text = text; x.due = f.elements['due'].value || ''; S.editing = null;
  } else if (f.dataset.form === 'todo') {
    // まとめて追加: 1行1件。「・」「-」「- [ ]」などの頭の記号は取る。チェック済み「- [x]」は飛ばす
    const lines = f.elements['text'].value.split(/\r?\n/)
      .filter(l => !/^\s*[-*+]\s*\[[xX]\]/.test(l))
      .map(l => l.replace(/^\s*(?:[-*+・•]|\d+[.)])?\s*(?:\[ \]\s*)?/, '').trim()).filter(Boolean);
    if (!lines.length) return;
    const due = f.elements['due'].value || '';
    lines.forEach(text => S.todos.push({ id: uid(), text: text.slice(0, 80), due, done: null }));
    if (lines.length > 1) S.bulk = false;
  } else return;
  f.reset(); saveTasks(); render();
  const inp = $(`[data-form=${f.dataset.form}] [name=text], [data-form=${f.dataset.form}] [name=name]`); if (inp) inp.focus();
});

// 勉強の操作
function addStudy(sid, min, at) {
  const t = now(), before = Calc.stats(S.log, S.settings, t, S);
  S.study.push({ id: uid(), s: sid, min, at });
  S.lastSubj = sid; save(); render();
  const after = Calc.stats(S.log, S.settings, t, S);
  pop(after.lv > before.lv ? `覚醒 Lv.${after.lv}` : `${subjOf(sid).name} +${fmtMin(min)}${after.xp > before.xp ? ` ・ +${after.xp - before.xp} XP` : ''}`, '#face3');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-s]'); if (!b) return;
  const ss = S.settings.study, id = b.dataset.id;
  switch (b.dataset.s) {
    case 'stop': {
      const tm = ss.timer; if (!tm) return;
      ss.timer = null;
      const min = Math.min(24 * 60, Math.round((now() - tm.at) / 60000));
      if (min < 1) { save(); render(); pop('1分未満'); return; }
      addStudy(tm.s, min, tm.at); return;
    }
    case 'cancel': if (!confirm('タイマーを取り消しますか？（記録しません）')) return; ss.timer = null; break;
    case 'edel': { const x = S.study.find(x => x.id === id); if (!x || !confirm(`${subjOf(x.s).name} ${fmtMin(x.min)} の記録を消しますか？（霊獣の成長もその分もどります）`)) return;
      S.study = S.study.filter(x => x.id !== id); break; }
    case 'sdel': { const x = ss.subjects.find(x => x.id === id); if (!x || !confirm(`教科「${x.name}」を消しますか？（記録は残ります）`)) return;
      ss.subjects = ss.subjects.filter(x => x.id !== id); break; }
    case 'color': { const x = ss.subjects.find(x => x.id === id); if (x) x.color = b.dataset.c; break; }
    default: return;
  }
  save(); render();
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('[data-s-open]')) S.sOpen = e.target.open; }, true);
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset.sk; if (!k) return;
  const ss = S.settings.study, t = now();
  if (k === 'goal') { const v = Number(el.value); if (!(v >= .5 && v <= 100)) { render(); return; } ss.goals = Object.assign({}, ss.goals, { [Calc.week(t)]: Math.round(v * 60) }); }
  if (k === 'name') { const v = el.value.trim(); const z = Calc.study(S.study, ss, t); if (!v || !z.pet) return; z.pet.name = v; }
  save(); render();
});
document.addEventListener('submit', async e => {
  const f = e.target, ss = S.settings.study, t = now();
  e.preventDefault();
  if (!['start', 'manual', 'egg', 'grad', 'subj', 'import'].includes(f.dataset.form)) return;
  if (f.dataset.form === 'start') {
    const sid = f.elements['s'].value; if (!sid) return;
    S.lastSubj = sid; ss.timer = { s: sid, at: +t };
  } else if (f.dataset.form === 'manual') {
    const sid = f.elements['s'].value, dv = f.elements['d'].value;
    const min = (parseInt(f.elements['h'].value, 10) || 0) * 60 + (parseInt(f.elements['m'].value, 10) || 0);
    if (!sid) return;
    if (min < 1 || min > 1440) { alert('時間は1分から24時間のあいだで入れてね'); return; }
    if (!dv || dv < Calc.week(t) || dv > Calc.ymd(t)) { alert('日付は今週の月曜から今日までをえらんでね'); return; }
    const at = dv === Calc.ymd(t) ? +t : Calc.parse(dv).setHours(20, 0, 0, 0);
    addStudy(sid, min, at); return;
  } else if (f.dataset.form === 'egg' || f.dataset.form === 'grad') {
    const z = Calc.study(S.study, ss, t), p = z.pet, name = f.elements['name'].value.trim();
    if (f.dataset.form === 'grad') {
      if (z.stage < 4 || z.died) return;
      if (!name) { f.elements['name'].focus(); f.elements['name'].placeholder = '次の子の名前を入れてね'; return; }
      p.end = { t: +t, k: 'grad' };
    } else p.end = { t: +t, k: 'gone', w: z.died };
    ss.pets.push(newPet(ss, name, +t));
  } else if (f.dataset.form === 'subj') {
    const name = f.elements['name'].value.trim(); if (!name) return;
    if (ss.subjects.some(x => x.name === name)) { alert(`「${name}」はもうあるよ`); return; }
    ss.subjects.push({ id: 's' + uid(), name, color: SCOLORS[ss.subjects.length % SCOLORS.length] });
  } else if (f.dataset.form === 'import') {
    const file = f.elements['file'].files && f.elements['file'].files[0];
    let data;
    try { data = JSON.parse((file ? await file.text() : f.elements['text'].value).trim()); } catch (err) { alert('読みこめませんでした。書き出したファイルを選ぶか、中身をそのまま貼りつけてね'); return; }
    if (!data || data.app !== 'benkyo-pet' || !data.settings || typeof data.weeks !== 'object') { alert('山海勉強録のデータではないようです'); return; }
    const r = importBenkyo(data, t);
    if (!confirm(`勉強の記録 ${r.entries}件、広場の霊獣 ${r.plaza}体（★あわせて${r.stars}）を引っ越します。今の勉強の霊獣は上書きされます。よいですか？`)) return;
    r.apply(); S.sOpen = false;
    save(); render(); window.scrollTo(0, 0); return;
  }
  f.reset(); save(); render();
});
// 山海勉強録(benkyo-pet)の書き出しファイルを、この形に直す
const BP_OLD = { slime: 'teikou', neko: 'kyubi', tori: 'hippou', usagi: 'kyubi', kuma: 'shokai', ryu: 'ouryu', saikyo: 'fei', reiko: 'shokai', reirei: 'rokushoku', seiseigyu: 'fei', gouyu: 'goutei',
  toukou: 'goutei', toutou: 'heihou', ji: 'kanso', bougyu: 'gouin', kyuki: 'sugo', ryoukyo: 'tenkou', mougyoku: 'sou', kaimei: 'rikugo', rara: 'sugo', kou: 'shoushou', katsuso: 'shoushou', sojo: 'hiso',
  keihen: 'shoushou', hihi: 'tenkou', kitsuryou: 'tenba', shuen: 'chouyuu', youwa: 'kyoho', seiei: 'shu', ranchou: 'kyuhou', houou: 'kyuhou', sanseichou: 'hiyoku', sushi: 'shu', shouda: 'fukei',
  chin: 'hippou', kinhi: 'kochou', shunchou: 'kujo', atsuyu: 'ouryu', enni: 'souryu', kou2: 'ouryu', zeni: 'yuugyo', kokou: 'riku', shiniku: 'teikou', fusho: 'kakujo', jukuko: 'eishou' };
const bpId = id => FROM_BP[id] || FROM_BP[BP_OLD[id]] || null;
function importBenkyo(data, t) {
  const st = data.settings, entries = [];
  Object.keys(data.weeks).forEach(w => (data.weeks[w].entries || []).forEach(e => {
    if (e && e.min > 0 && e.at) entries.push({ id: 'bp-' + (e.id || uid()), s: e.s, min: Math.round(e.min), at: e.at });
  }));
  // 交配の子は、両親の絵(art)の霊獣を親にする。親がわからないときは名前から決まる霊獣に
  const toPet = (o, rest) => {
    const p = Object.assign({ id: 'bp-' + (o.id || uid()), name: o.name || 'もち' }, rest);
    if (o.hyb) {
      const [a, b] = (o.hyb.art || []).map(bpId);
      if (a && b && a !== b) { p.sp = 'h' + uid(); p.hyb = { a: String(a), b: String(b) }; return p; }
    }
    p.sp = String(bpId(o.species) || (o.hyb && bpId((o.hyb.art || [])[0])) || Calc.egg(p.name + p.id));
    return p;
  };
  const plaza = (st.plaza || []).map(e => toPet(e, { t: +t, imp: 1, n: Math.max(1, e.rank || 1), end: { t: +t, k: 'grad' } }));
  const firstAt = Math.min(+t, ...entries.map(e => e.at));
  const pet = toPet(st.pet || {}, { t: (st.pet && st.pet.bornAt) || firstAt });
  const goals = {};
  (st.history || []).forEach(h => { if (h.week && h.goal) goals[h.week] = h.goal; });
  goals[Calc.week(t)] = st.goalMin || 600;
  const weeks = [...Object.keys(data.weeks), ...(st.history || []).map(h => h.week)].filter(Boolean).sort();
  return {
    entries: entries.length, plaza: plaza.length, stars: plaza.reduce((a, p) => a + p.n, 0),
    apply() {
      const have = new Set(S.study.map(e => e.id));
      S.study = [...S.study, ...entries.filter(e => !have.has(e.id))];
      const ss = S.settings.study;
      ss.subjects = (st.subjects || []).map(x => ({ id: x.id, name: x.name, color: x.color || SCOLORS[0] }));
      ss.goals = goals;
      ss.from = [weeks[0] || Calc.week(t), ss.from].sort()[0];
      ss.graves = (st.graves || []).map(g => ({ name: g.name, born: g.born, died: g.died }));
      ss.timer = st.timer && st.timer.s ? { s: st.timer.s, at: st.timer.at } : ss.timer;
      ss.pets = [...ss.pets.filter(p => p.end && p.end.k === 'grad'), ...plaza, pet];
      if (st.nextEgg && st.nextEgg.art) { const [a, b] = st.nextEgg.art.map(bpId); if (a && b && a !== b) ss.nextEgg = { a: String(a), b: String(b) }; }
    },
  };
}
// カウントダウンは毎秒書きかえ、段階が変わったら画面ごと描き直す
setInterval(() => {
  const t = now();
  document.querySelectorAll('[data-until]').forEach(el => { el.textContent = mmss(el.dataset.until - t); });
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = clockText(); });
  const ph = Calc.judge(Calc.plan(Calc.ymd(t), S.settings), S.log[Calc.ymd(t)], t, S.settings).phase;
  if (ph !== lastPhase && (S.tab === 'wake' || WIDE.matches) && !(document.activeElement && document.activeElement.matches('input, textarea'))) render();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.soon(100); if (!document.hidden && !(document.activeElement && document.activeElement.matches('input'))) render(); });

render();
Sync.soon(100);
setInterval(() => { if (!document.hidden) Sync.soon(100); }, 60000);
// 開き直したときも、2回目の待ち時間中なら知らせる準備をする
(() => { const t = now(), j = Calc.judge(Calc.plan(Calc.ymd(t), S.settings), S.log[Calc.ymd(t)], t, S.settings); if (j.phase === 'wait') armSecond(j.from - t); })();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
