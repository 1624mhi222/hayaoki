<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="早起き">
<meta name="theme-color" content="#fbf7ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>早起き</title>
<style>
  :root {
    --bg: #fbf7ef; --card: #ffffff; --ink: #1f1f1d; --quiet: #6b6a66; --line: #ebe5d8; --chip: #f1ece2;
    --accent: #e08a00; --accent-soft: #fff0d4; --good: #2f8f5e; --good-soft: #dff2e7;
    --warn: #c26a12; --warn-soft: #fbeedd; --bad: #b3261e; --bad-soft: #f9e2df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --card: #23211e; --ink: #f0efeb; --quiet: #a3a19b; --line: #36332e; --chip: #2e2b27;
      --accent: #f5a524; --accent-soft: #3b2c12; --good: #6cc196; --good-soft: #1f3529;
      --warn: #f0a24f; --warn-soft: #3a2a17; --bad: #f2867d; --bad-soft: #3d201d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .label { font-size: 13px; color: var(--quiet); }
  h2 { font-size: 15px; margin: 0 0 10px; }
  /* キャラクター */
  .pet { display: flex; gap: 14px; align-items: center; }
  .pet .face { font-size: 64px; line-height: 1; width: 84px; height: 84px; display: grid; place-items: center;
    background: var(--accent-soft); border-radius: 24px; flex: none; }
  .pet .face.hop { animation: hop .7s cubic-bezier(.3,1.6,.5,1) 2; }
  @keyframes hop { 40% { transform: translateY(-14px) rotate(-6deg); } }
  .pet .info { flex: 1; min-width: 0; }
  .pet .name { font-weight: 700; font-size: 17px; }
  .bar { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s; }
  .stats { display: flex; gap: 8px; margin-top: 12px; }
  .stat { flex: 1; background: var(--bg); border-radius: 12px; padding: 8px 10px; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  /* 今日 */
  .today .when { font-size: 14px; color: var(--quiet); }
  .today .msg { font-size: 22px; font-weight: 700; margin: 6px 0 4px; }
  .today .hint { font-size: 14px; color: var(--quiet); }
  .big { display: block; width: 100%; border: 0; border-radius: 20px; padding: 26px 12px; margin-top: 14px;
    font: inherit; font-size: 26px; font-weight: 800; color: #fff; background: var(--accent); box-shadow: 0 6px 0 #b86f00; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #b86f00; }
  .big.second { background: var(--good); box-shadow: 0 6px 0 #1f6a44; }
  .big.second:active { box-shadow: 0 2px 0 #1f6a44; }
  .count { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin: 6px 0; }
  .result { border-radius: 14px; padding: 14px; margin-top: 12px; font-size: 15px; }
  .result.perfect { background: var(--good-soft); } .result.attended { background: var(--warn-soft); }
  .result.absent { background: var(--bad-soft); }
  .result .parts { margin-top: 8px; display: grid; gap: 2px; }
  .today .btn b { font-variant-numeric: tabular-nums; }
  .result b { font-size: 18px; }
  /* きろく */
  .weeks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .weeks .wd { text-align: center; font-size: 11px; color: var(--quiet); }
  .weeks .c { aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; font-size: 11px; color: var(--quiet); background: none; }
  .weeks .c.cls { background: var(--chip); }
  .weeks .c.perfect { background: var(--good); color: #fff; } .weeks .c.attended { background: var(--warn); color: #fff; }
  .weeks .c.absent { background: var(--bad); color: #fff; }
  .weeks .c.now { outline: 2px solid var(--accent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--quiet); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  /* 設定 */
  details summary { cursor: pointer; font-weight: 600; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; margin-top: 12px; }
  input[type=time], input[type=number] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
  .btn { border: 0; border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; background: var(--chip); color: var(--ink); width: 100%; margin-top: 10px; }
  .btn.main { background: var(--accent); color: #fff; }
  .note { font-size: 13px; color: var(--quiet); margin: 8px 0 0; }
  .linkbtn { border: 0; background: none; color: var(--bad); font: inherit; font-size: 13px; padding: 0; margin-top: 12px; }
  .pop { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 800; color: var(--accent);
    pointer-events: none; animation: pop 1.6s ease-out forwards; text-shadow: 0 2px 0 var(--card); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .pet .face.hop, .pop { animation: none; } }
  /* タブ */
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px; z-index: 5;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .tabs button { flex: 1; max-width: 244px; border: 0; border-radius: 12px; padding: 10px; font: inherit; font-weight: 600; background: none; color: var(--quiet); }
  .tabs button.on { background: var(--accent-soft); color: var(--ink); }
  .pet .face.plant { background: var(--good-soft); }
  .bar.green > div { background: var(--good); }
  /* 日課・TODO */
  .item { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; }
  .item .what { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .what small { display: block; color: var(--quiet); font-size: 12px; }
  .item.off { opacity: .5; }
  .item.donef .what { text-decoration: line-through; color: var(--quiet); }
  .tick { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); font-size: 18px; color: #fff; display: grid; place-items: center; }
  .tick.on { background: var(--good); border-color: var(--good); }
  .del { flex: none; border: 0; background: none; color: var(--quiet); font-size: 18px; width: 32px; height: 32px; }
  .fire { font-size: 12px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .due { font-size: 12px; border-radius: 6px; padding: 1px 6px; background: var(--chip); color: var(--quiet); margin-left: 4px; }
  .due.today { background: var(--warn-soft); color: var(--warn); } .due.over { background: var(--bad-soft); color: var(--bad); }
  .add { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add input[type=text] { flex: 1 1 160px; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .add textarea { flex: 1 1 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); resize: vertical; }
  .add input[type=date] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .add .btn { width: auto; margin: 0; padding: 10px 16px; }
  .days { display: flex; gap: 4px; width: 100%; }
  .days button { flex: 1; border: 1px solid transparent; background: var(--chip); color: var(--ink); border-radius: 999px; padding: 6px 0; font: inherit; font-size: 13px; }
  .what[data-t=open] { cursor: pointer; }
  .add.editing { padding: 10px; margin: 6px 0; border-radius: 12px; background: var(--accent-soft); }
  .add.editing .btn { flex: 1; margin: 0; }
  .btn.danger { color: var(--bad); }
  .days.mode { margin-top: 4px; } .days .label { align-self: center; }
  .days input.every { width: 64px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); text-align: center; }
  .days button.on { background: var(--good-soft); border-color: var(--good); font-weight: 600; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .head .linkbtn { color: var(--accent); margin: 0; }
  .empty { color: var(--quiet); font-size: 14px; padding: 6px 0; }
  .graves { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; font-size: 13px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .pet .face.wilt { background: var(--bad-soft); filter: saturate(.6); }
  .warnline { color: var(--bad); }
</style>
</head>
<body>
<main id="app"></main>
<script>
// ---- 計算(画面と切り離した純粋な関数) ----
const MIN = 60000;
const WIN = 20;   // 2回目のチェックインを押せる長さ(分)
const EARLY = 15, LATE = 30;   // 「授業に出た」を押せるのは授業の15分前から30分後まで
const RESULT = {
  perfect: '大成功！ 早起きして、二度寝せず、授業に出た',
  attended: '授業には出られた',
  absent: '授業を休んだ…',
};
// レベルごとの姿。lv はその姿になるレベル
const STAGES = [
  { lv: 1, face: '🥚', name: 'たまご' }, { lv: 2, face: '🐣', name: 'われかけのたまご' }, { lv: 3, face: '🐥', name: 'ひよこ' },
  { lv: 5, face: '🐤', name: '元気なひよこ' }, { lv: 7, face: '🐦', name: '小鳥' }, { lv: 10, face: '🕊️', name: 'はと' },
  { lv: 14, face: '🦜', name: 'オウム' }, { lv: 19, face: '🦅', name: 'わし' }, { lv: 25, face: '🦚', name: 'くじゃく' }, { lv: 32, face: '🐉', name: 'ドラゴン' },
];
const PLANTS = [
  { lv: 1, face: '🫘', name: 'たね' }, { lv: 2, face: '🌱', name: 'め' }, { lv: 3, face: '🌿', name: 'わかば' },
  { lv: 5, face: '🪴', name: 'はちうえ' }, { lv: 7, face: '🌷', name: 'つぼみ' }, { lv: 10, face: '🌻', name: 'ひまわり' },
  { lv: 14, face: '🌳', name: '木' }, { lv: 19, face: '🌸', name: 'さくらの木' }, { lv: 25, face: '🍎', name: 'りんごの木' },
];
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const Calc = {
  pad: n => String(n).padStart(2, '0'),
  ymd(d) { return d.getFullYear() + '-' + this.pad(d.getMonth() + 1) + '-' + this.pad(d.getDate()); },
  hm(d) { return this.pad(d.getHours()) + ':' + this.pad(d.getMinutes()); },
  parse(ymd) { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d); },
  addDays(ymd, k) { const d = this.parse(ymd); d.setDate(d.getDate() + k); return this.ymd(d); },
  // その日の授業・目標起床・チェックインを押せるようになる時刻。授業がない日は null
  plan(ymd, s) {
    const t = s.classes[this.parse(ymd).getDay()];
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    const cls = this.parse(ymd); cls.setHours(h, m, 0, 0);
    const target = new Date(cls - s.lead * MIN);
    return { cls, target, open: new Date(target - 90 * MIN) };
  },
  // 今どの段階か(phase)と、決まっていれば結果(result)と経験値の内訳(parts)
  // 流れ: 起きた(c1) → 二度寝チェック(c2) → 授業に出た(c3)
  judge(p, rec, now, s) {
    if (!p) return { phase: 'off' };
    rec = rec || {};
    const [c1, c2, c3] = ['c1', 'c2', 'c3'].map(k => rec[k] ? new Date(rec[k]) : null);
    const aOpen = new Date(p.cls - EARLY * MIN), aClose = new Date(+p.cls + LATE * MIN);
    const from = c1 && new Date(+c1 + s.gap * MIN), until = c1 && new Date(+from + WIN * MIN);
    if (c3 || now >= aClose) {
      const parts = {
        wake: !c1 ? 0 : c1 < +p.target + MIN ? 10 : 3,
        stay: c2 ? 10 : 0,
        attend: !c3 ? 0 : c3 < +p.cls + 6 * MIN ? 15 : 5,
      };
      const result = !c3 ? 'absent' : parts.wake === 10 && parts.stay && parts.attend === 15 ? 'perfect' : 'attended';
      return { phase: 'done', result, parts, xp: parts.wake + parts.stay + parts.attend, c1, c2, c3 };
    }
    if (!c1 && now < p.open) return { phase: 'early' };
    if (!c1 && now < p.cls) return { phase: 'wake', late: now > p.target, aOpen };
    const canC2 = c1 && !c2 && now >= from && now < until;
    if (now >= aOpen) return { phase: 'attend', canC2, until, aClose, c1 };
    if (c1 && !c2 && now < from) return { phase: 'wait', from, c1 };
    if (canC2) return { phase: 'second', until, c1 };
    return { phase: 'go', aOpen, c1 };
  },
  // 使い始めた日から今日までを順に見て、経験値と連続記録を数える
  // 大成功で連続+1。授業を休んだらひよこは死んで、お墓に入り、たまごからやり直し(経験値も連続も0)
  stats(log, s, now) {
    const today = this.ymd(now);
    let xp = 0, streak = 0, best = 0, perfect = 0, days = 0;
    const graves = [];
    for (let d = s.start; d <= today; d = this.addDays(d, 1)) {
      const j = this.judge(this.plan(d, s), log[d], now, s);
      if (!j.result) continue;
      days++; xp += j.xp;
      if (j.result === 'perfect') { streak++; perfect++; }
      best = Math.max(best, streak);
      if (j.result === 'absent') {
        const L = this.level(xp);
        graves.push({ day: d, lv: L.lv, face: L.stage.face, name: L.stage.name });
        xp = 0; streak = 0;
      }
    }
    return { xp, streak, best, perfect, days, graves, gen: graves.length + 1, ...this.level(xp) };
  },
  // レベル1→2は40、そこから1レベルごとに必要な経験値が20ずつ増える
  level(xp, stages = STAGES) {
    let lv = 1, need = 40, rest = xp;
    while (rest >= need) { rest -= need; lv++; need += 20; }
    const stage = stages.filter(x => x.lv <= lv).pop();
    const next = stages.find(x => x.lv > lv);
    return { lv, into: rest, need, stage, next };
  },
  // 日課とTODOで育てる植物。ひよことは別の経験値。日課1回+5、TODO1つ+8
  // 罰: やる日に日課をしなかったら1回-5、TODOは期限を過ぎた1日ごとに-3(終わらせるまで続く)。経験値は0より下がらない
  garden(st, today) {
    const checks = Object.values(st.hlog).reduce((a, l) => a + l.length, 0);
    const done = st.todos.filter(x => x.done).length;
    let missed = 0, missedY = 0, late = 0;
    const yday = this.addDays(today, -1);
    st.habits.forEach(h => {
      for (let d = h.since || today; d < today; d = this.addDays(d, 1)) {
        if (this.isDue(h, d) && !(st.hlog[d] || []).includes(h.id)) { missed++; if (d === yday) missedY++; }
      }
    });
    st.todos.forEach(x => {
      if (!x.due) return;
      const end = x.done ? this.ymd(new Date(x.done)) : today;
      late += Math.max(0, Math.round((this.parse(end) - this.parse(x.due)) / 864e5));
    });
    const penalty = missed * 5 + late * 3;
    const xp = Math.max(0, checks * 5 + done * 8 - penalty);
    const L = this.level(xp, PLANTS);
    const wilted = missedY > 0 || st.todos.some(x => !x.done && x.due && x.due < today);
    return { xp, penalty, missedY, wilted, ...L };
  },
  // 日課をやる日か。曜日で決めるもの(days)と、始めた日からN日ごとのもの(every)がある
  isDue(h, d) {
    if (h.every) { const k = Math.round((this.parse(d) - this.parse(h.since)) / 864e5); return k >= 0 && k % h.every === 0; }
    return h.days.includes(this.parse(d).getDay());
  },
  nextDue(h, d) { for (let k = 1; k <= 60; k++) { const x = this.addDays(d, k); if (this.isDue(h, x)) return x; } return null; },
  // その日課が何回続けてできているか。今日まだなら昨日までを数える
  habitStreak(h, hlog, today) {
    let n = 0, d = today;
    if (!(hlog[d] || []).includes(h.id)) d = this.addDays(d, -1);
    for (let k = 0; k < 400; k++, d = this.addDays(d, -1)) {
      if (!this.isDue(h, d)) continue;
      if (h.since && d < h.since) break;
      if ((hlog[d] || []).includes(h.id)) n++; else break;
    }
    return n;
  },
  // カレンダー用(.ics)。授業の曜日ごとに、目標起床の時刻と2回目の時刻に通知が鳴る予定を毎週くり返す
  ics(s, now) {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//hayaoki//JA', 'CALSCALE:GREGORIAN'];
    const stamp = now.toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
    for (let k = 0; k < 7; k++) {
      const d = this.addDays(this.ymd(now), k), p = this.plan(d, s);
      if (!p) continue;
      const t = p.target, f = x => this.ymd(x).replace(/-/g, '') + 'T' + this.hm(x).replace(':', '') + '00';
      const by = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][t.getDay()];
      lines.push('BEGIN:VEVENT', 'UID:hayaoki-' + by + '@1624mhi222.github.io', 'DTSTAMP:' + stamp,
        'DTSTART:' + f(t), 'DTEND:' + f(new Date(+t + (s.gap + 5) * MIN)), 'RRULE:FREQ=WEEKLY;BYDAY=' + by,
        'SUMMARY:☀️ 早起きアプリで「起きた！」を押す',
        'DESCRIPTION:授業 ' + this.hm(p.cls) + '。' + s.gap + '分後に「まだ起きてる！」、授業に着いたら「授業に出た！」を押す',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:起きた！を押す', 'TRIGGER:PT0M', 'END:VALARM',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:まだ起きてる？2回目を押す', 'TRIGGER:PT' + s.gap + 'M', 'END:VALARM',
        'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:授業が始まる。着いたら「授業に出た」を押す', 'TRIGGER:PT' + Math.max(0, s.lead - EARLY) + 'M', 'END:VALARM',
        'END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  },
};

// ---- 保存 ----
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// テスト用: ?now=2026-11-02T06:50 で時計をずらす(そこから普通に進む)
const shift = (q => q ? new Date(q) - Date.now() : 0)(new URLSearchParams(location.search).get('now'));
const now = () => new Date(Date.now() + shift);

const S = {
  settings: store.get('ha-settings', null) || { classes: { 1: '08:00', 3: '08:00', 5: '10:00' }, lead: 60, gap: 15, start: Calc.ymd(now()) },
  log: store.get('ha-log', {}),
  tab: store.get('ha-tab', 'wake'),
  habits: store.get('ha-habits', []),     // { id, name, days: [曜日の数字] }
  hlog: store.get('ha-hlog', {}),         // { 'YYYY-MM-DD': [日課のid] }
  todos: store.get('ha-todos', []),       // { id, text, due, done }
  edit: false, newDays: [0, 1, 2, 3, 4, 5, 6], showDone: false, bulk: false, newEvery: false, editing: null, ed: { every: 0, days: [] },
};
const saveTasks = () => { store.set('ha-habits', S.habits); store.set('ha-hlog', S.hlog); store.set('ha-todos', S.todos); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const saveSettings = () => store.set('ha-settings', S.settings);
const saveLog = () => store.set('ha-log', S.log);
saveSettings();

// ---- 画面 ----
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Calc.pad(Math.floor(t / 60)) + ':' + Calc.pad(t % 60); };

function petCard(st) {
  const pct = Math.round(st.into / st.need * 100);
  const graves = st.graves.length ? `<div class="graves"><span class="label">お墓</span> ${st.graves.slice(-8).reverse().map((g, i) =>
    `<span title="${g.day}">🪦 ${st.graves.length - i}代目 ${g.face}Lv.${g.lv} <span class="label">${Number(g.day.slice(5, 7))}/${Number(g.day.slice(8))}</span></span>`).join('')}</div>` : '';
  return `<section class="card"><div class="pet">
    <div class="face" id="face">${st.stage.face}</div>
    <div class="info"><div class="name">${st.gen > 1 ? `<span class="label">${st.gen}代目</span> ` : ''}${st.stage.name} <span class="label">Lv.${st.lv}</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div class="label">次のレベルまで ${st.need - st.into} XP${st.next ? ` ・ Lv.${st.next.lv}で${st.next.face}に進化` : ''}</div></div></div>
    <div class="stats">
      <div class="stat"><span class="label">🔥 連続成功</span><b>${st.streak}</b></div>
      <div class="stat"><span class="label">最高記録</span><b>${st.best}</b></div>
      <div class="stat"><span class="label">大成功</span><b>${st.perfect}<span class="label">/${st.days}回</span></b></div>
    </div>${graves}</section>`;
}

function todayCard(t) {
  const d = Calc.ymd(t), p = Calc.plan(d, S.settings), j = Calc.judge(p, S.log[d], t, S.settings);
  let head = `<div class="when">${t.getMonth() + 1}月${t.getDate()}日(${WD[t.getDay()]})`;
  if (p) head += ` ・ 授業 ${Calc.hm(p.cls)} ・ 目標起床 <b>${Calc.hm(p.target)}</b>`;
  head += '</div>';
  let body = '';
  if (j.phase === 'off') {
    const nx = nextClass(d);
    body = `<div class="msg">今日は授業なし 🌙</div><div class="hint">${nx ? `次は ${nx}。前の日は早めに寝よう` : '設定で授業の時間を入れてね'}</div>`;
  } else if (j.phase === 'early') {
    body = `<div class="msg">まだ早いよ</div><div class="hint">${Calc.hm(p.open)} から押せるようになります</div>`;
  } else if (j.phase === 'wake') {
    body = `<div class="msg">${j.late ? '目標を過ぎてる！急いで' : 'おはよう！'}</div>
      <div class="hint">${j.late ? `授業 ${Calc.hm(p.cls)} までに押せば少しだけ経験値` : `${Calc.hm(p.target)} までに押すと大成功のチャンス`}。授業を休むとひよこが死にます</div>
      <button class="big" data-act="c1">☀️ 起きた！</button>`;
  } else if (j.phase === 'wait') {
    body = `<div class="msg">二度寝チェックまで</div><div class="count" data-until="${+j.from}">${mmss(j.from - t)}</div>
      <div class="hint">布団から出て、顔を洗ったり着替えたりしておこう。${Calc.hm(j.from)} から ${WIN}分のあいだに「まだ起きてる！」を押してね。<br>スマホのタイマーを${S.settings.gap}分にしておくと確実です。</div>`;
  } else if (j.phase === 'second') {
    body = `<div class="msg">まだ起きてる？</div><div class="hint">あと <b data-until="${+j.until}">${mmss(j.until - t)}</b> 以内に押してね</div>
      <button class="big second" data-act="c2">💪 まだ起きてる！</button>`;
  } else if (j.phase === 'go') {
    body = `<div class="msg">準備して出発しよう 🎒</div><div class="hint">授業まで</div><div class="count" data-until="${+p.cls}">${mmss(p.cls - t)}</div>
      <div class="hint">${Calc.hm(j.aOpen)} から「授業に出た！」を押せます。教室に着いたら（オンラインなら授業に入ったら）押してね。</div>`;
  } else if (j.phase === 'attend') {
    const late = t > +p.cls + 5 * MIN;
    body = `<div class="msg">${late ? '遅れても、出れば経験値！' : j.c1 ? '授業に着いた？' : '寝坊しても、今から出よう'}</div>
      <div class="hint">${Calc.hm(j.aClose)} まで押せます${late ? '' : `。${Calc.hm(new Date(+p.cls + 5 * MIN))} までなら時間どおり`}</div>
      <button class="big second" data-act="c3">🎓 授業に出た！</button>
      ${j.canC2 ? `<button class="btn" data-act="c2">💪 まだ起きてる！（2回目）あと <b data-until="${+j.until}">${mmss(j.until - t)}</b></button>` : ''}`;
  } else {
    const r = j.result, q = j.parts;
    const line = (ok, label, pts, time) => `<div>${ok ? '✅' : '▫️'} ${label}${time ? ` <span class="label">${Calc.hm(time)}</span>` : ''} <b class="label">+${pts}</b></div>`;
    body = `<div class="result ${r}"><b>${r === 'perfect' ? '🎉 ' : ''}${RESULT[r]}</b> <span>+${j.xp} XP</span>
      <div class="parts">${line(q.wake === 10, q.wake === 3 ? '起きた（目標より遅れ）' : '目標の時間までに起きた', q.wake, j.c1)}
      ${line(q.stay, '二度寝しなかった', q.stay, j.c2)}
      ${line(q.attend === 15, q.attend === 5 ? '授業に出た（遅刻）' : '授業に出た', q.attend, j.c3)}</div>
      ${r === 'absent' ? '<div class="note">🪦 授業を休んだので、ひよこは死んでしまいました。新しいたまごからやり直しです</div>' : ''}</div>`;
  }
  return `<section class="card today">${head}${body}</section>`;
}

function nextClass(d) {
  for (let k = 1; k <= 7; k++) {
    const x = Calc.addDays(d, k), p = Calc.plan(x, S.settings);
    if (p) return `${WD[p.cls.getDay()]}曜 ${Calc.hm(p.cls)}の授業（${Calc.hm(p.target)}起床）`;
  }
  return null;
}

// 直近5週間。月曜はじまり
function weeksCard(t) {
  const today = Calc.ymd(t);
  const back = (t.getDay() + 6) % 7;
  const first = Calc.addDays(today, -back - 28);
  let cells = ['月', '火', '水', '木', '金', '土', '日'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let k = 0; k < 35; k++) {
    const d = Calc.addDays(first, k), p = Calc.plan(d, S.settings);
    let cls = 'c';
    if (p && d >= S.settings.start && d <= today) {
      const j = Calc.judge(p, S.log[d], t, S.settings);
      cls += ' cls' + (j.result ? ' ' + j.result : '');
    } else if (p && d > today) cls += ' cls';
    if (d === today) cls += ' now';
    cells += `<div class="${cls}">${Number(d.slice(8))}</div>`;
  }
  return `<section class="card"><h2>きろく</h2><div class="weeks">${cells}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>大成功</span><span><i style="background:var(--warn)"></i>出席できた</span>
    <span><i style="background:var(--bad)"></i>欠席</span><span><i style="background:var(--chip)"></i>授業の日</span></div></section>`;
}

function settingsCard() {
  const s = S.settings;
  const rows = [1, 2, 3, 4, 5, 6, 0].map(w => `<label>${WD[w]}曜</label><input type="time" data-wd="${w}" value="${s.classes[w] || ''}">`).join('');
  return `<section class="card"><details><summary>設定</summary>
    <p class="note">授業がある曜日に、始まる時間を入れてください。空欄の日は授業なしです。</p>
    <div class="grid">${rows}
      <label>授業の何分前に起きる</label><input type="number" min="10" max="240" step="5" data-k="lead" value="${s.lead}">
      <label>2回目までの分数</label><input type="number" min="5" max="60" step="1" data-k="gap" value="${s.gap}">
    </div>
    <button class="btn main" data-act="ics">📅 カレンダーに通知を入れる</button>
    <p class="note">授業の曜日の起床時間と${s.gap}分後に通知が出る予定を、毎週くり返しで追加します。アプリを閉じていても知らせてくれます。時間を変えたら、前の予定を消してから入れ直してください。</p>
    <button class="btn" data-act="notify">🔔 アプリを開いているときの通知を許可</button>
    <button class="linkbtn" data-act="reset">きろくを全部消す</button>
  </details></section>`;
}

// ---- TODO・日課 ----
function gardenCard(g, t) {
  const today = Calc.ymd(t), wd = t.getDay();
  const due = S.habits.filter(h => Calc.isDue(h, today)), did = due.filter(h => (S.hlog[today] || []).includes(h.id));
  const left = S.todos.filter(x => !x.done).length;
  const overdue = S.todos.filter(x => !x.done && x.due && x.due < today).length;
  return `<section class="card"><div class="pet">
    <div class="face plant ${g.wilted ? 'wilt' : ''}" id="face">${g.wilted ? '🥀' : g.stage.face}</div>
    <div class="info"><div class="name">${g.wilted ? 'しおれた' : ''}${g.stage.name} <span class="label">Lv.${g.lv}</span></div>
      <div class="bar green"><div style="width:${Math.round(g.into / g.need * 100)}%"></div></div>
      <div class="label">次のレベルまで ${g.need - g.into} XP${g.next ? ` ・ Lv.${g.next.lv}で${g.next.face}に` : ''}</div></div></div>
    <div class="stats">
      <div class="stat"><span class="label">今日の日課</span><b>${did.length}<span class="label">/${due.length}</span></b></div>
      <div class="stat"><span class="label">のこりTODO</span><b>${left}</b></div>
      <div class="stat"><span class="label">サボりの罰</span><b>${g.penalty ? '−' + g.penalty : 0}<span class="label"> XP</span></b></div>
    </div>${g.wilted ? `<div class="note warnline">${g.missedY ? `昨日の日課を${g.missedY}つサボったので` : ''}${g.missedY && overdue ? '、' : ''}${overdue ? `期限切れのTODOが${overdue}つあるので` : ''}しおれています。期限切れは1日ごとに−3XP</div>` : ''}
    <p class="note">日課 +5 ・ TODO +8 ・ 日課をサボると −5 ・ 期限切れTODOは1日 −3</p></section>`;
}
function habitsCard(t) {
  const today = Calc.ymd(t), wd = t.getDay(), done = S.hlog[today] || [];
  const list = [...S.habits].sort((a, b) => Calc.isDue(b, today) - Calc.isDue(a, today));
  const daysTxt = h => h.every ? `${h.every}日に1回` : h.days.length === 7 ? '毎日' : [1, 2, 3, 4, 5, 6, 0].filter(d => h.days.includes(d)).map(d => WD[d]).join('・');
  const rows = list.map(h => {
    if (S.editing === h.id) return habitEditor(h);
    const on = Calc.isDue(h, today), ok = done.includes(h.id), n = Calc.habitStreak(h, S.hlog, today);
    return `<div class="item ${on ? '' : 'off'}">
      <button class="tick ${ok ? 'on' : ''}" data-t="hcheck" data-id="${h.id}" ${on ? '' : 'disabled'} aria-label="できた">${ok ? '✓' : ''}</button>
      <div class="what" data-t="open" data-id="${h.id}">${esc(h.name)}<small>${daysTxt(h)}${on ? '' : (n => ` ・ 今日はお休み${n ? `（次は${Number(n.slice(5, 7))}/${Number(n.slice(8))}）` : ''}`)(Calc.nextDue(h, today))}</small></div>
      ${n ? `<span class="fire">🔥${n}</span>` : ''}</div>`;
  }).join('') || '<div class="empty">毎日やりたいことを入れてみよう（例: 薬を飲む、筋トレ、日記）</div>';
  return `<section class="card"><div class="head"><h2>日課</h2><span class="label">名前をタップで編集</span></div>${rows}
    <form class="add" data-form="habit"><input type="text" name="name" placeholder="新しい日課" maxlength="40" autocomplete="off"><button class="btn main">追加</button>
    ${scheduleInputs(S.newEvery ? 3 : 0, S.newDays, '')}</form></section>`;
}
// 曜日のボタン・N日ごとの入力。新しく足すときと編集するときで同じものを使う
function scheduleInputs(every, days, pre) {
  const mode = `<div class="days mode"><button type="button" class="${every ? '' : 'on'}" data-t="${pre}mode" data-v="0">曜日で決める</button><button type="button" class="${every ? 'on' : ''}" data-t="${pre}mode" data-v="1">N日に1回</button></div>`;
  const chips = every
    ? `<span class="label">${pre ? '始めた日から' : '今日から'}</span><input type="number" name="every" min="2" max="60" value="${every}" class="every"><span class="label">日に1回</span>`
    : [1, 2, 3, 4, 5, 6, 0].map(d => `<button type="button" class="${days.includes(d) ? 'on' : ''}" data-t="${pre}day" data-d="${d}">${WD[d]}</button>`).join('');
  return `${mode}<div class="days">${chips}</div>`;
}
function habitEditor(h) {
  return `<form class="add editing" data-form="ehabit" data-id="${h.id}"><input type="text" name="name" value="${esc(h.name)}" maxlength="40" autocomplete="off">
    ${scheduleInputs(S.ed.every, S.ed.days, 'e')}
    <div class="days"><button class="btn main">保存</button><button type="button" class="btn" data-t="cancel">やめる</button><button type="button" class="btn danger" data-t="hdel" data-id="${h.id}">消す</button></div></form>`;
}
function todosCard(t) {
  const today = Calc.ymd(t);
  const open = S.todos.filter(x => !x.done).sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0);
  const done = S.todos.filter(x => x.done).sort((a, b) => a.done < b.done ? 1 : -1);
  const dueTag = x => {
    if (!x.due) return '';
    const cls = x.due < today ? 'over' : x.due === today ? 'today' : '';
    const txt = x.due === today ? '今日まで' : x.due === Calc.addDays(today, 1) ? '明日まで' : `${Number(x.due.slice(5, 7))}/${Number(x.due.slice(8))}${x.due < today ? ' 過ぎてる' : 'まで'}`;
    return `<span class="due ${cls}">${txt}</span>`;
  };
  const row = x => S.editing === x.id ? `<form class="add editing" data-form="etodo" data-id="${x.id}">
      <input type="text" name="text" value="${esc(x.text)}" maxlength="80" autocomplete="off"><input type="date" name="due" value="${x.due || ''}" aria-label="期限">
      <div class="days"><button class="btn main">保存</button><button type="button" class="btn" data-t="cancel">やめる</button></div></form>` : `<div class="item ${x.done ? 'donef' : ''}">
    <button class="tick ${x.done ? 'on' : ''}" data-t="tcheck" data-id="${x.id}" aria-label="できた">${x.done ? '✓' : ''}</button>
    <div class="what" data-t="open" data-id="${x.id}">${esc(x.text)}${x.done ? '' : dueTag(x)}</div>
    <button class="del" data-t="tdel" data-id="${x.id}" aria-label="消す">✕</button></div>`;
  return `<section class="card"><h2>TODO</h2>${open.map(row).join('') || '<div class="empty">やることはぜんぶ終わり 🎉</div>'}
    <form class="add" data-form="todo">${S.bulk
      ? `<textarea name="text" rows="6" placeholder="1行に1つずつ。メモアプリやObsidianからそのまま貼りつけてOK"></textarea>`
      : `<input type="text" name="text" placeholder="やること" maxlength="80" autocomplete="off">`}
      <input type="date" name="due" aria-label="期限"><button class="btn main">追加</button></form>
    <button class="linkbtn" style="color:var(--accent)" data-t="bulk">${S.bulk ? '1つずつ追加にもどす' : '📋 まとめて追加'}</button><br>
    ${done.length ? `<button class="linkbtn" style="color:var(--quiet)" data-t="showdone">${S.showDone ? '完了したものを隠す' : `完了したもの（${done.length}）`}</button>${S.showDone ? done.slice(0, 30).map(row).join('') : ''}` : ''}
  </section>`;
}
function tabsBar() {
  return `<nav class="tabs"><button class="${S.tab === 'wake' ? 'on' : ''}" data-t="tab" data-v="wake">🐤 早起き</button>
    <button class="${S.tab === 'tasks' ? 'on' : ''}" data-t="tab" data-v="tasks">🌱 TODO・日課</button></nav>`;
}

let lastPhase = null;
function render() {
  const t = now();
  const open = $('details') && $('details').open;
  if (S.tab === 'tasks') {
    // 曜日をえらんだりチェックしたりしても、書きかけの入力は消さない
    const keep = [...document.querySelectorAll('form[data-form] input, form[data-form] textarea')].map(i => [i.form.dataset.form, i.name, i.value]);
    const focused = document.activeElement && document.activeElement.form && document.activeElement.name ? [document.activeElement.form.dataset.form, document.activeElement.name] : null;
    $('#app').innerHTML = gardenCard(Calc.garden(S, Calc.ymd(t)), t) + habitsCard(t) + todosCard(t) + tabsBar();
    keep.forEach(([f, n, v]) => { const i = $(`[data-form=${f}] [name=${n}]`); if (i) i.value = v; });
    if (focused) { const i = $(`[data-form=${focused[0]}] [name=${focused[1]}]`); if (i) i.focus(); }
  } else {
    const st = Calc.stats(S.log, S.settings, t);
    $('#app').innerHTML = petCard(st) + todayCard(t) + weeksCard(t) + settingsCard() + tabsBar();
    if (open) $('details').open = true;
  }
  lastPhase = Calc.judge(Calc.plan(Calc.ymd(t), S.settings), S.log[Calc.ymd(t)], t, S.settings).phase;
}

function pop(text) {
  const el = document.createElement('div'); el.className = 'pop'; el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1700);
  const f = $('#face'); if (f) { f.classList.remove('hop'); void f.offsetWidth; f.classList.add('hop'); }
}

// 開いたままにしているとき、2回目の時間になったら音と通知で知らせる
let alarm = null;
function armSecond(ms) {
  clearTimeout(alarm);
  alarm = setTimeout(() => {
    try { if (Notification.permission === 'granted') new Notification('まだ起きてる？', { body: '「まだ起きてる！」を押してね', icon: 'icon-192.png' }); } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
    beep();
    render();
  }, ms);
}
let ctx = null;
function beep() {
  try {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(at => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.2, ctx.currentTime + at); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + at + .3);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + .3);
    });
  } catch (e) {}
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const t = now(), d = Calc.ymd(t), act = b.dataset.act;
  if (act === 'c1' || act === 'c2' || act === 'c3') {
    const before = Calc.stats(S.log, S.settings, t);
    S.log[d] = Object.assign({}, S.log[d], { [act]: t.toISOString() });
    saveLog();
    if (act === 'c1') {
      try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}   // 押したときに音を使えるようにしておく
      armSecond(S.settings.gap * MIN);
    }
    render();
    const after = Calc.stats(S.log, S.settings, t);
    if (act === 'c3') pop(after.lv > before.lv ? `レベルアップ！ Lv.${after.lv}` : `+${after.xp - before.xp} XP`);
    else pop(act === 'c1' ? 'おはよう！' : 'えらい！');
  } else if (act === 'ics') {
    const blob = new Blob([Calc.ics(S.settings, t)], { type: 'text/calendar' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hayaoki.ics'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } else if (act === 'notify') {
    try { Notification.requestPermission().then(p => alert(p === 'granted' ? '許可しました' : '許可されませんでした')); }
    catch (err) { alert('この端末では通知を使えません'); }
  } else if (act === 'reset') {
    if (confirm('きろくと経験値を全部消します。よいですか？')) { S.log = {}; S.settings.start = d; saveLog(); saveSettings(); render(); }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.wd) { if (el.value) S.settings.classes[el.dataset.wd] = el.value; else delete S.settings.classes[el.dataset.wd]; }
  else if (el.dataset.k) { const v = Number(el.value); if (v > 0) S.settings[el.dataset.k] = v; }
  else return;
  saveSettings(); render();
});

// TODO・日課の操作
document.addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  const t = now(), d = Calc.ymd(t), id = b.dataset.id, before = Calc.garden(S, Calc.ymd(t));
  switch (b.dataset.t) {
    case 'tab': S.tab = b.dataset.v; store.set('ha-tab', S.tab); window.scrollTo(0, 0); break;
    case 'showdone': S.showDone = !S.showDone; break;
    case 'bulk': S.bulk = !S.bulk; break;
    case 'mode': S.newEvery = b.dataset.v === '1'; break;
    case 'open': {
      const h = S.habits.find(x => x.id === id);
      S.editing = id; if (h) S.ed = { every: h.every || 0, days: [...h.days] };
      break;
    }
    case 'cancel': S.editing = null; break;
    case 'emode': S.ed.every = b.dataset.v === '1' ? (S.ed.every || 3) : 0; if (!S.ed.every && !S.ed.days.length) S.ed.days = [0, 1, 2, 3, 4, 5, 6]; break;
    case 'eday': { const v = Number(b.dataset.d); S.ed.days = S.ed.days.includes(v) ? S.ed.days.filter(x => x !== v) : [...S.ed.days, v]; break; }
    case 'day': { const v = Number(b.dataset.d); S.newDays = S.newDays.includes(v) ? S.newDays.filter(x => x !== v) : [...S.newDays, v]; break; }
    case 'hcheck': { const l = S.hlog[d] || []; S.hlog[d] = l.includes(id) ? l.filter(x => x !== id) : [...l, id]; if (!S.hlog[d].length) delete S.hlog[d]; break; }
    case 'hdel': { const h = S.habits.find(x => x.id === id); if (h && confirm(`「${h.name}」を消しますか？（もらった経験値はそのまま）`)) { S.habits = S.habits.filter(x => x.id !== id); S.editing = null; } break; }
    case 'tcheck': { const x = S.todos.find(x => x.id === id); if (x) x.done = x.done ? null : t.toISOString(); break; }
    case 'tdel': S.todos = S.todos.filter(x => x.id !== id); break;
    default: return;
  }
  saveTasks(); render();
  const after = Calc.garden(S, Calc.ymd(t));
  if (after.xp > before.xp) pop(after.lv > before.lv ? `レベルアップ！ Lv.${after.lv}` : `+${after.xp - before.xp} XP`);
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === 'habit') {
    const name = f.elements['name'].value.trim(); if (!name) return;
    if (S.newEvery) {
      const every = Math.round(Number(f.elements['every'].value));
      if (!(every >= 2 && every <= 60)) { alert('2〜60日のあいだで入れてね'); return; }
      S.habits.push({ id: uid(), name, every, days: [], since: Calc.ymd(now()) });
    } else {
      if (!S.newDays.length) { alert('やる曜日を1つ以上えらんでね'); return; }
      S.habits.push({ id: uid(), name, days: [...S.newDays].sort(), since: Calc.ymd(now()) });
    }
    S.newDays = [0, 1, 2, 3, 4, 5, 6]; S.newEvery = false;
  } else if (f.dataset.form === 'ehabit') {
    const h = S.habits.find(x => x.id === f.dataset.id); if (!h) return;
    const name = f.elements['name'].value.trim(); if (!name) return;
    if (S.ed.every) {
      const every = Math.round(Number(f.elements['every'].value));
      if (!(every >= 2 && every <= 60)) { alert('2〜60日のあいだで入れてね'); return; }
      // N日ごとに変えたときは、今日を始まりにする
      if (!h.every) h.since = Calc.ymd(now());
      h.every = every; h.days = [];
    } else {
      if (!S.ed.days.length) { alert('やる曜日を1つ以上えらんでね'); return; }
      delete h.every; h.days = [...S.ed.days].sort();
    }
    h.name = name; S.editing = null;
  } else if (f.dataset.form === 'etodo') {
    const x = S.todos.find(x => x.id === f.dataset.id); if (!x) return;
    const text = f.elements['text'].value.trim(); if (!text) return;
    x.text = text; x.due = f.elements['due'].value || ''; S.editing = null;
  } else if (f.dataset.form === 'todo') {
    // まとめて追加: 1行1件。「・」「-」「- [ ]」などの頭の記号は取る。チェック済み「- [x]」は飛ばす
    const lines = f.elements['text'].value.split(/\r?\n/)
      .filter(l => !/^\s*[-*+]\s*\[[xX]\]/.test(l))
      .map(l => l.replace(/^\s*(?:[-*+・•]|\d+[.)])?\s*(?:\[ \]\s*)?/, '').trim()).filter(Boolean);
    if (!lines.length) return;
    const due = f.elements['due'].value || '';
    lines.forEach(text => S.todos.push({ id: uid(), text: text.slice(0, 80), due, done: null }));
    if (lines.length > 1) S.bulk = false;
  } else return;
  f.reset(); saveTasks(); render();
  const inp = $(`[data-form=${f.dataset.form}] [name=text], [data-form=${f.dataset.form}] [name=name]`); if (inp) inp.focus();
});

// カウントダウンは毎秒書きかえ、段階が変わったら画面ごと描き直す
setInterval(() => {
  const t = now();
  document.querySelectorAll('[data-until]').forEach(el => { el.textContent = mmss(el.dataset.until - t); });
  const ph = Calc.judge(Calc.plan(Calc.ymd(t), S.settings), S.log[Calc.ymd(t)], t, S.settings).phase;
  if (ph !== lastPhase && S.tab === 'wake') render();
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !(document.activeElement && document.activeElement.matches('input'))) render(); });

render();
// 開き直したときも、2回目の待ち時間中なら知らせる準備をする
(() => { const t = now(), j = Calc.judge(Calc.plan(Calc.ymd(t), S.settings), S.log[Calc.ymd(t)], t, S.settings); if (j.phase === 'wait') armSecond(j.from - t); })();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
